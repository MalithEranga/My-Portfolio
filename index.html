<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Malith Eranga | Modern Pixels & Chemical Technology</title>

    <!-- Font: Poppins (Clean, Modern, Geometric Sans-Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00f5d4;
            --secondary: #00bbf9;
            --bg-abyss: #020710;
            --glass-bg: rgba(8, 20, 38, 0.65);
            --glass-border: rgba(255, 255, 255, 0.14);
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-abyss);
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: var(--text-light);
            touch-action: none;
            cursor: default;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================
           1. FULL-SCREEN MOLECULAR SYNTHESIS OVERLAY
              (Zero bottom text, zero progress bars,
               seamless coordinate lock with #display-heading)
        ========================================== */
        /* ==========================================
           1. CRYSTALLINE BENZENE EMBLEM & SMOOTH REVEAL
              (Self-drawing SVG C6H6 structure above title,
               no bottom loading bars, default cursor)
        ========================================== */
        #benzene-emblem-stage {
            position: relative;
            width: clamp(78px, 11vw, 108px);
            height: clamp(78px, 11vw, 108px);
            margin-bottom: clamp(10px, 2vh, 18px);
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transform: translateY(18px) scale(0.9);
            transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 1.1s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1.1s ease;
            filter: drop-shadow(0 0 24px rgba(0, 245, 212, 0.45));
        }

        #main-scene.active #benzene-emblem-stage {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .emblem-orbit {
            position: absolute;
            inset: -12%;
            border-radius: 50%;
            border: 1px solid rgba(0, 245, 212, 0.2);
        }

        .emblem-orbit.o1 {
            border-top-color: var(--primary);
            border-bottom-color: rgba(0, 187, 249, 0.5);
            animation: orbitSpin1 8s linear infinite;
        }

        .emblem-orbit.o2 {
            inset: -3%;
            border-left-color: var(--secondary);
            border-right-color: rgba(0, 245, 212, 0.45);
            animation: orbitSpin2 10s linear infinite;
        }

        @keyframes orbitSpin1 {
            0% { transform: rotateX(66deg) rotateY(18deg) rotateZ(0deg); }
            100% { transform: rotateX(66deg) rotateY(18deg) rotateZ(360deg); }
        }

        @keyframes orbitSpin2 {
            0% { transform: rotateX(24deg) rotateY(66deg) rotateZ(360deg); }
            100% { transform: rotateX(24deg) rotateY(66deg) rotateZ(0deg); }
        }

        #benzene-emblem-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .hex-draw-path {
            stroke-dasharray: 260;
            stroke-dashoffset: 260;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #main-scene.active .hex-draw-path {
            stroke-dashoffset: 0;
        }

        .pi-ring-rot {
            transform-origin: 50px 50px;
            animation: piRotate 12s linear infinite;
        }

        @keyframes piRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bz-node {
            opacity: 0;
            transform-origin: center;
            transition: opacity 0.6s ease, filter 0.6s ease;
        }

        #main-scene.active .bz-node {
            opacity: 1;
            filter: drop-shadow(0 0 5px #00f5d4);
        }

        /* ==========================================
           2. MAIN SCENE & STATIC CENTER STAGE
        ========================================== */
        #main-scene {
            position: relative;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
        }

        #particleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Static Hero Stage */
        #hero-stage {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .text-wrapper {
            width: 100%;
            text-align: center;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* EXACT POPPINS 800 DISPLAY HERO TITLE — Smooth Liquid-Light Reveal */
        .display-title {
            position: relative;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 8.2vw, 6.8rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            column-gap: 0.28em;
            row-gap: 0.05em;
            filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.85));
        }

        .word-box {
            display: inline-flex;
            white-space: nowrap;
        }

        .b-char {
            display: inline-block;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 55%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            opacity: 0;
            transform: translateY(34px) scale(0.94);
            filter: blur(10px) brightness(1.6) drop-shadow(0 0 24px rgba(0, 245, 212, 0.75));
            transition: opacity 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1.15s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform, filter;
        }

        #main-scene.active .b-char {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0px) brightness(1) drop-shadow(0 0 12px rgba(0, 245, 212, 0.15));
        }

        .subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.9rem, 1.7vw, 1.15rem);
            letter-spacing: 0.2px;
            margin-top: 14px;
            color: #cbd5e1;
            font-weight: 400;
            line-height: 1.6;
            max-width: 680px;
            opacity: 0;
            transform: translateY(22px);
            filter: blur(6px);
            transition: opacity 1s 0.75s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 1s 0.75s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1s 0.75s cubic-bezier(0.16, 1, 0.3, 1);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
        }

        #main-scene.active .subtitle {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0px);
        }

        .highlight {
            color: var(--primary);
            font-weight: 600;
        }

        /* ==========================================
           3. PROFESSIONAL BUTTONS WITH DESCRIPTIONS
        ========================================== */
        .buttons-container {
            margin-top: clamp(26px, 4.5vh, 42px);
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: translateY(26px);
            filter: blur(6px);
            transition: opacity 1s 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 1s 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1s 0.95s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #main-scene.active .buttons-container {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0px);
            pointer-events: auto;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            width: 100%;
        }

        #enter-btn {
            padding: 15px 42px;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.95rem, 2.2vw, 1.05rem);
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #020813;
            background: linear-gradient(135deg, #00f5d4 0%, #00bbf9 100%);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 12px 32px -6px rgba(0, 245, 212, 0.45);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #enter-btn:hover, #enter-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 16px 38px -4px rgba(0, 245, 212, 0.65);
            filter: brightness(1.05);
        }

        #enter-btn svg {
            transition: transform 0.3s ease;
        }

        #enter-btn:hover svg {
            transform: translateX(4px);
        }

        .secondary-buttons-row {
            display: flex;
            gap: 18px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .secondary-buttons-row .button-group {
            flex: 1;
            max-width: 270px;
        }

        .secondary-btn {
            width: 100%;
            padding: 13px 26px;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.88rem, 2vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.2px;
            color: var(--text-light);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .secondary-btn:hover, .secondary-btn:active {
            color: #ffffff;
            border-color: rgba(0, 245, 212, 0.6);
            background: rgba(0, 245, 212, 0.14);
            box-shadow: 0 8px 25px -4px rgba(0, 245, 212, 0.25);
            transform: translateY(-2px);
        }

        .btn-desc {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.72rem, 1.5vw, 0.78rem);
            font-weight: 400;
            color: #cbd5e1;
            opacity: 0.82;
            letter-spacing: 0.2px;
            text-align: center;
            line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
        }

        /* ==========================================
           4. WATERFALL PAGE TRANSITION
        ========================================== */
        #waterfall-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 130vh;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            transform: translateY(-100%);
            transition: transform 1.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        #waterfall-overlay.active {
            transform: translateY(0);
            pointer-events: all;
        }

        .water-fill {
            flex: 1;
            background: #01040a;
        }

        .waves {
            position: relative;
            width: 100%;
            height: 15vh;
            min-height: 100px;
            max-height: 200px;
            transform: rotate(180deg);
            margin-bottom: -2px;
        }

        .parallax > use {
            animation: move-forever 2.2s cubic-bezier(.55,.5,.45,.5) infinite;
        }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 4s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 6s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 8s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 11s; }

        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }

        /* ==========================================
           5. MOBILE & TABLET RESPONSIVE BREAKPOINTS
        ========================================== */
        @media (max-width: 768px) {
            #enter-btn {
                width: 100%;
                max-width: 320px;
                padding: 14px 28px;
            }
            .secondary-buttons-row {
                max-width: 480px;
                gap: 14px;
            }
        }

        @media (max-width: 520px) {
            .display-title {
                font-size: clamp(2.2rem, 11vw, 3.3rem);
            }
            .subtitle {
                margin-top: 10px;
                font-size: 0.85rem;
            }
            .buttons-container {
                margin-top: 22px;
                gap: 14px;
            }
            .secondary-buttons-row {
                flex-direction: column;
                align-items: center;
                width: 100%;
                gap: 14px;
            }
            .secondary-buttons-row .button-group {
                max-width: 290px;
                width: 100%;
            }
            #enter-btn {
                max-width: 290px;
                padding: 13px 24px;
            }
            .secondary-btn {
                padding: 12px 20px;
            }
            .btn-desc {
                font-size: 0.7rem;
            }
        }

        /* Short Horizontal Mobile Landscape Mode */
        @media (max-height: 540px) {
            .display-title {
                font-size: clamp(2rem, 8vh, 3rem);
            }
            .subtitle {
                margin-top: 6px;
                font-size: 0.78rem;
            }
            .buttons-container {
                margin-top: 14px;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 94vw;
                gap: 12px;
            }
            .button-group {
                width: auto;
            }
            .secondary-buttons-row {
                width: auto;
                gap: 12px;
            }
            .btn-desc {
                display: none;
            }
            #enter-btn, .secondary-btn {
                padding: 10px 22px;
                font-size: 0.85rem;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Waterfall Page Transition -->
    <div id="waterfall-overlay">
        <div class="water-fill"></div>
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(0, 245, 212, 0.25)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(0, 187, 249, 0.45)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(4, 13, 26, 0.9)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="#01040a" />
            </g>
        </svg>
    </div>

    <!-- Main Interactive Scene -->
    <div id="main-scene">
        <canvas id="particleCanvas"></canvas>

        <!-- Static Center Hero Stage -->
        <div id="hero-stage">
            <div class="text-wrapper">
                <!-- Crystalline C6H6 Benzene Emblem -->
                <div id="benzene-emblem-stage" aria-hidden="true">
                    <div class="emblem-orbit o1"></div>
                    <div class="emblem-orbit o2"></div>
                    <svg id="benzene-emblem-svg" viewBox="0 0 100 100">
                        <!-- Radial C-H Covalent Spokes -->
                        <g stroke="rgba(148, 163, 184, 0.68)" stroke-width="1.4" stroke-linecap="round">
                            <line x1="50" y1="12" x2="50" y2="2"/>
                            <line x1="82.9" y1="31" x2="91.6" y2="26"/>
                            <line x1="82.9" y1="69" x2="91.6" y2="74"/>
                            <line x1="50" y1="88" x2="50" y2="98"/>
                            <line x1="17.1" y1="69" x2="8.4" y2="74"/>
                            <line x1="17.1" y1="31" x2="8.4" y2="26"/>
                        </g>
                        <!-- Outer Hexagonal Carbon-Carbon Ring -->
                        <polygon class="hex-draw-path" points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31"
                                 fill="rgba(0, 245, 212, 0.05)"
                                 stroke="#00f5d4"
                                 stroke-width="2.6"
                                 stroke-linejoin="round"/>
                        <!-- Kekulé Alternating Double-Bond Inner Bars -->
                        <g stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" opacity="0.88">
                            <line x1="53.5" y1="18.8" x2="76.2" y2="31.9"/>
                            <line x1="76.8" y1="66.2" x2="54.1" y2="79.3"/>
                            <line x1="23.2" y1="63.8" x2="23.2" y2="36.2"/>
                        </g>
                        <!-- Delocalized Pi-Electron Aromatic Ring -->
                        <circle class="pi-ring-rot" cx="50" cy="50" r="19"
                                fill="none"
                                stroke="#00bbf9"
                                stroke-width="1.6"
                                stroke-dasharray="5 3.5"
                                opacity="0.85"/>
                        <!-- 6 Carbon (sp2) Vertex Nodes -->
                        <g fill="#020813" stroke="#00f5d4" stroke-width="2.1">
                            <circle class="bz-node" style="transition-delay: 0.15s" cx="50" cy="12" r="3.6"/>
                            <circle class="bz-node" style="transition-delay: 0.25s" cx="82.9" cy="31" r="3.6"/>
                            <circle class="bz-node" style="transition-delay: 0.35s" cx="82.9" cy="69" r="3.6"/>
                            <circle class="bz-node" style="transition-delay: 0.45s" cx="50" cy="88" r="3.6"/>
                            <circle class="bz-node" style="transition-delay: 0.55s" cx="17.1" cy="69" r="3.6"/>
                            <circle class="bz-node" style="transition-delay: 0.65s" cx="17.1" cy="31" r="3.6"/>
                        </g>
                        <!-- 6 Outer Hydrogen (H) Terminals -->
                        <g fill="#e0f2fe">
                            <circle cx="50" cy="2" r="2.1"/>
                            <circle cx="91.6" cy="26" r="2.1"/>
                            <circle cx="91.6" cy="74" r="2.1"/>
                            <circle cx="50" cy="98" r="2.1"/>
                            <circle cx="8.4" cy="74" r="2.1"/>
                            <circle cx="8.4" cy="26" r="2.1"/>
                        </g>
                    </svg>
                </div>

                <h1 class="display-title" id="display-heading" aria-label="MALITH ERANGA"></h1>
                <p class="subtitle">
                    BSc (Hons) in Chemical Technology &bull; <span class="highlight">Sabaragamuwa University of Sri Lanka</span>
                </p>
            </div>

            <!-- Navigation Buttons with Clear Descriptions -->
            <div class="buttons-container">
                <div class="button-group">
                    <button id="enter-btn" class="nav-trigger" data-target="main.html">
                        <span>Explore Portfolio</span>
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                    <span class="btn-desc">Academic research, software &amp; personal projects</span>
                </div>

                <div class="secondary-buttons-row">
                    <div class="button-group">
                        <button class="secondary-btn nav-trigger" data-target="modernpixels.html">Modern Pixels</button>
                        <span class="btn-desc">Creative graphic design &amp; web studio</span>
                    </div>

                    <div class="button-group">
                        <button class="secondary-btn nav-trigger" data-target="Article.html">Insights Blog</button>
                        <span class="btn-desc">Articles on technology, chemistry &amp; design</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================
           0. VIEWPORT & POINTER INITIALIZATION (Standard System Cursor)
        ========================================================== */
        let viewW = window.innerWidth;
        let viewH = window.innerHeight;

        let mouse = {
            x: viewW * 0.5,
            y: viewH * 0.5,
            prevX: viewW * 0.5,
            prevY: viewH * 0.5,
            lastMoveTime: 0,
            isMoving: false
        };

        /* ==========================================================
           1. BUILD MAIN HERO HEADING ("MALITH ERANGA" IN POPPINS 800)
        ========================================================== */
        const headingEl = document.getElementById('display-heading');
        const mainScene = document.getElementById('main-scene');
        const titleWords = ["MALITH", "ERANGA"];
        let globalCharCount = 0;

        titleWords.forEach(word => {
            const wBox = document.createElement('span');
            wBox.className = 'word-box';
            for (let ch of word) {
                const cSpan = document.createElement('span');
                cSpan.className = 'b-char';
                cSpan.textContent = ch;
                cSpan.style.transitionDelay = `${0.22 + globalCharCount * 0.045}s`;
                wBox.appendChild(cSpan);
                globalCharCount++;
            }
            headingEl.appendChild(wBox);
        });

        /* ==========================================================
           2. POINTER / TOUCH TRACKING & HIGH-DPI CANVAS SETUP
        ========================================================== */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            viewW = window.innerWidth;
            viewH = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = viewW * dpr;
            canvas.height = viewH * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();

        function handlePointerMove(clientX, clientY) {
            const moveDist = Math.hypot(clientX - mouse.prevX, clientY - mouse.prevY);
            mouse.prevX = mouse.x;
            mouse.prevY = mouse.y;
            mouse.x = clientX;
            mouse.y = clientY;

            if (moveDist > 1.5) {
                mouse.lastMoveTime = performance.now();
                mouse.isMoving = true;
            }
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.isMoving = false;
        });

        /* ==========================================================
           4. POND ECOSYSTEM: BENZENE, RIPPLES, FOOD PELLETS & PETALS
        ========================================================== */
        let particlesArray = [];
        let waterRipples = [];
        let wakeBubbles = [];
        let foodPellets = [];
        let floatingPetals = [];

        class WaterRipple {
            constructor(x, y, maxR = 120, speed = 1.9, color = '0, 245, 212') {
                this.x = x;
                this.y = y;
                this.r = 4;
                this.maxR = maxR;
                this.speed = speed;
                this.color = color;
                this.alpha = 0.55;
            }
            update() {
                this.r += this.speed;
                this.alpha = Math.max(0, (1 - this.r / this.maxR) * 0.55);
            }
            draw() {
                if (this.alpha <= 0.01) return;
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();
            }
        }

        class FoodPellet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.r = 5.5;
                this.pulse = 0;
            }
            update() {
                this.pulse += 0.1;
            }
            draw() {
                ctx.save();
                const glowR = this.r + Math.sin(this.pulse) * 3 + 5;
                const grad = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, glowR);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#00f5d4');
                grad.addColorStop(1, 'rgba(0, 245, 212, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingPetal {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = initial ? Math.random() * viewW : -30;
                this.y = Math.random() * viewH;
                this.size = Math.random() * 4.5 + 3.5;
                this.vx = Math.random() * 0.35 + 0.15;
                this.vy = (Math.random() - 0.5) * 0.25;
                this.angle = Math.random() * Math.PI * 2;
                this.angVel = (Math.random() - 0.5) * 0.008;
                this.opacity = Math.random() * 0.25 + 0.12;
            }
            update(fishHead) {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.angVel;

                if (fishHead) {
                    const dx = this.x - fishHead.x;
                    const dy = this.y - fishHead.y;
                    const d = Math.hypot(dx, dy);
                    if (d < 120 && d > 1) {
                        const push = (120 - d) / 120;
                        this.x += (dx / d) * push * 1.8;
                        this.y += (dy / d) * push * 1.8;
                        this.angle += push * 0.04;
                    }
                }

                if (this.x > viewW + 40 || this.y < -40 || this.y > viewH + 40) {
                    this.reset(false);
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = `rgba(255, 195, 215, ${this.opacity})`;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(this.size, -this.size * 0.7, this.size * 1.6, 0, 0, this.size);
                ctx.bezierCurveTo(-this.size * 1.6, 0, -this.size, -this.size * 0.7, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        class BenzeneMolecule {
            constructor() {
                this.x = Math.random() * viewW;
                this.y = Math.random() * viewH;
                this.z = Math.random() * 0.8 + 0.2;
                this.size = (Math.random() * 8 + 5) * this.z;
                this.vx = (Math.random() - 0.5) * 0.45 * this.z;
                this.vy = (Math.random() - 0.5) * 0.45 * this.z;
                this.rot = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.008;
                this.opacity = this.z * 0.32 + 0.06;
            }
            update(fishHead) {
                this.x += this.vx;
                this.y += this.vy;
                this.rot += this.rotSpeed;

                if (this.x < -50) this.x = viewW + 50;
                if (this.x > viewW + 50) this.x = -50;
                if (this.y < -50) this.y = viewH + 50;
                if (this.y > viewH + 50) this.y = -50;

                if (fishHead) {
                    const dx = this.x - fishHead.x;
                    const dy = this.y - fishHead.y;
                    const d = Math.hypot(dx, dy);
                    if (d < 150 && d > 1) {
                        const force = (150 - d) / 150;
                        this.x += (dx / d) * force * 2.2 * this.z;
                        this.y += (dy / d) * force * 2.2 * this.z;
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.strokeStyle = `rgba(0, 245, 212, ${this.opacity})`;
                ctx.lineWidth = 0.7;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i * Math.PI) / 3;
                    const px = Math.cos(a) * this.size;
                    const py = Math.sin(a) * this.size;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.55, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function initEcosystem() {
            particlesArray = [];
            floatingPetals = [];
            const molCount = Math.min(Math.floor((viewW * viewH) / 22000), 40);
            const petalCount = viewW < 600 ? 8 : 14;
            for (let i = 0; i < molCount; i++) particlesArray.push(new BenzeneMolecule());
            for (let i = 0; i < petalCount; i++) floatingPetals.push(new FloatingPetal());
        }
        initEcosystem();

        /* ==========================================================
           5. ULTRA-REALISTIC IMPERIAL KOI ENGINE
        ========================================================== */
        const koiPalettes = [
            // Palette 0: Original Imperial Kohaku Red-Orange & White (Default from frame 1!)
            {
                base1: [255, 250, 245],
                base2: [255, 82, 32],
                tail: [255, 145, 45],
                fin: [255, 240, 225],
                patch: [235, 45, 18],
                glow: [255, 105, 45]
            },
            // Palette 1: Bioluminescent Cyan/Aqua Catalyst
            {
                base1: [240, 255, 254],
                base2: [0, 245, 212],
                tail: [0, 187, 249],
                fin: [185, 250, 255],
                patch: [14, 165, 233],
                glow: [0, 245, 212]
            },
            // Palette 2: Yamabuki Ogon Imperial Gold
            {
                base1: [255, 253, 230],
                base2: [250, 190, 20],
                tail: [245, 130, 10],
                fin: [254, 243, 170],
                patch: [234, 88, 12],
                glow: [250, 204, 21]
            },
            // Palette 3: Showa Neon Rose-Violet
            {
                base1: [255, 240, 248],
                base2: [244, 63, 94],
                tail: [168, 85, 247],
                fin: [253, 180, 195],
                patch: [190, 18, 60],
                glow: [244, 63, 94]
            }
        ];

        let paletteIdx = 0;
        let curPal = JSON.parse(JSON.stringify(koiPalettes[0]));

        function lerpArr(a, b, t) {
            for (let i = 0; i < 3; i++) a[i] += (b[i] - a[i]) * t;
        }

        function updateColors() {
            const target = koiPalettes[paletteIdx];
            lerpArr(curPal.base1, target.base1, 0.045);
            lerpArr(curPal.base2, target.base2, 0.045);
            lerpArr(curPal.tail, target.tail, 0.045);
            lerpArr(curPal.fin, target.fin, 0.045);
            lerpArr(curPal.patch, target.patch, 0.045);
            lerpArr(curPal.glow, target.glow, 0.045);
        }

        function rgba(arr, alpha = 1) {
            return `rgba(${Math.round(arr[0])}, ${Math.round(arr[1])}, ${Math.round(arr[2])}, ${alpha})`;
        }

        function normAngle(a) {
            while (a > Math.PI) a -= Math.PI * 2;
            while (a < -Math.PI) a += Math.PI * 2;
            return a;
        }

        function drawCatmullClosed(ctx, pts) {
            if (pts.length < 3) return;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 0; i < pts.length; i++) {
                const p0 = pts[(i - 1 + pts.length) % pts.length];
                const p1 = pts[i];
                const p2 = pts[(i + 1) % pts.length];
                const p3 = pts[(i + 2) % pts.length];
                ctx.bezierCurveTo(
                    p1.x + (p2.x - p0.x) / 6,
                    p1.y + (p2.y - p0.y) / 6,
                    p2.x - (p3.x - p1.x) / 6,
                    p2.y - (p3.y - p1.y) / 6,
                    p2.x,
                    p2.y
                );
            }
            ctx.closePath();
        }

        class UltraRealisticKoi {
            constructor() {
                this.numSegs = 32;
                this.baseSegLen = 7.2;
                this.baseProfile = [
                    8.5, 16.5, 23.5, 29, 32.8, 35, 35.5, 34.8, 33.2, 31,
                    28.5, 25.8, 23, 20.2, 17.6, 15.2, 13, 11, 9.2, 7.6,
                    6.3, 5.2, 4.3, 3.6, 3.0, 2.5, 2.0, 1.6, 1.2, 0.9, 0.6, 0.3
                ];

                this.scale = 1;
                this.segLen = this.baseSegLen;
                this.profile = [...this.baseProfile];
                this.updateScale();

                // Spawn on the left side facing a calm, wide diagonal across the pond
                this.spine = [];
                this.x = viewW * 0.16;
                this.y = viewH * 0.68;
                this.angle = -0.28;

                this.velocity = 2.2 * this.scale;
                this.glideImpulse = 0;
                this.swimCycle = 0;
                this.finCycle = 0;
                this.mouthOpen = 0;
                this.entranceAlpha = 0;

                // First waypoint is far across the pond so the Koi glides in a long, serene arc
                this.roamTarget = {
                    x: viewW * 0.82,
                    y: viewH * 0.28
                };

                this.patches = [
                    { seg: 1, sideOffset: 0.0, rx: 14, ry: 12 },
                    { seg: 6, sideOffset: 0.16, rx: 26, ry: 19 },
                    { seg: 12, sideOffset: -0.22, rx: 22, ry: 16 },
                    { seg: 18, sideOffset: 0.14, rx: 16, ry: 12 },
                    { seg: 23, sideOffset: -0.08, rx: 11, ry: 8 }
                ];

                for (let i = 0; i < this.numSegs; i++) {
                    this.spine.push({
                        x: this.x - Math.cos(this.angle) * i * this.segLen,
                        y: this.y - Math.sin(this.angle) * i * this.segLen,
                        angle: this.angle
                    });
                }
            }

            updateScale() {
                const minDim = Math.min(viewW, viewH);
                this.scale = minDim < 480 ? 0.68 : (minDim < 768 ? 0.82 : 1.0);
                this.segLen = this.baseSegLen * this.scale;
                this.profile = this.baseProfile.map(w => w * this.scale);
            }

            pickNewRoamPoint() {
                const marginX = Math.min(100, viewW * 0.15);
                const marginY = Math.min(100, viewH * 0.15);
                const minTravelDist = Math.min(viewW, viewH) * 0.38;
                let nx, ny, tries = 0;
                do {
                    nx = marginX + Math.random() * Math.max(80, viewW - marginX * 2);
                    ny = marginY + Math.random() * Math.max(80, viewH - marginY * 2);
                    tries++;
                } while (
                    (Math.hypot(nx - this.x, ny - this.y) < minTravelDist ||
                     Math.hypot(nx - mouse.x, ny - mouse.y) < 110) &&
                    tries < 14
                );
                return { x: nx, y: ny };
            }

            update(time) {
                const now = performance.now();

                // Smoothly fade the Koi in during the opening scene transition
                if (this.entranceAlpha < 1) {
                    this.entranceAlpha = Math.min(1, this.entranceAlpha + 0.014);
                }

                const isMouseActivelyMoving = mouse.isMoving && (now - mouse.lastMoveTime < 380);
                if (!isMouseActivelyMoving) {
                    mouse.isMoving = false;
                }

                let targetX, targetY;
                let mode = "ROAM";

                if (foodPellets.length > 0) {
                    const pellet = foodPellets[0];
                    targetX = pellet.x;
                    targetY = pellet.y;
                    mode = "FEEDING";

                    const distToPellet = Math.hypot(targetX - this.x, targetY - this.y);
                    if (distToPellet < 95 * this.scale) {
                        this.mouthOpen = Math.min(1, (95 * this.scale - distToPellet) / (60 * this.scale));
                    }
                    if (distToPellet < 22) {
                        foodPellets.shift();
                        paletteIdx = (paletteIdx + 1) % koiPalettes.length;
                        this.glideImpulse = 3.6 * this.scale;
                        const g = koiPalettes[paletteIdx].glow;
                        waterRipples.push(new WaterRipple(this.x, this.y, 130 * this.scale, 2.2, `${g[0]}, ${g[1]}, ${g[2]}`));
                    }
                } else if (isMouseActivelyMoving && Math.hypot(mouse.x - this.x, mouse.y - this.y) > 95) {
                    targetX = mouse.x;
                    targetY = mouse.y;
                    mode = "FOLLOW";
                    this.mouthOpen *= 0.9;
                } else {
                    mode = "ROAM";
                    this.mouthOpen *= 0.9;

                    const distToRoam = Math.hypot(this.roamTarget.x - this.x, this.roamTarget.y - this.y);
                    if (distToRoam < 115) {
                        this.roamTarget = this.pickNewRoamPoint();
                        if (Math.random() < 0.6) this.glideImpulse = (1.3 + Math.random() * 1.1) * this.scale;
                    }
                    targetX = this.roamTarget.x;
                    targetY = this.roamTarget.y;
                }

                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.hypot(dx, dy);

                const meander = mode === "ROAM" ? Math.sin(time * 1.1) * 0.12 : 0;
                const desiredAngle = Math.atan2(dy, dx) + meander;
                let angleDiff = normAngle(desiredAngle - this.angle);

                // Gentle, realistic turning radius so the Koi never spins or twists sharply
                const maxTurn = mode === "ROAM" ? 0.032 : 0.048;
                const turnStep = Math.max(-maxTurn, Math.min(maxTurn, angleDiff * 0.09));
                this.angle = normAngle(this.angle + turnStep);

                this.glideImpulse *= 0.95;
                if (this.glideImpulse < 0.04) this.glideImpulse = 0;

                let targetVel;
                if (mode === "FEEDING") {
                    targetVel = Math.min(5.0 * this.scale, 2.4 * this.scale + dist * 0.011);
                } else if (mode === "FOLLOW") {
                    targetVel = Math.min(5.2 * this.scale, Math.max(2.0 * this.scale, dist * 0.02));
                } else {
                    const naturalPulse = (Math.sin(time * 1.3) + 1) * 0.38 * this.scale;
                    targetVel = 1.85 * this.scale + naturalPulse + this.glideImpulse;
                }

                this.velocity += (targetVel - this.velocity) * 0.055;

                this.swimCycle += 0.058 + (this.velocity / this.scale) * 0.026;
                this.finCycle += 0.052 + (this.velocity / this.scale) * 0.018;

                const headSway = Math.sin(this.swimCycle) * 0.034;
                const moveAngle = this.angle + headSway;

                this.x += Math.cos(moveAngle) * this.velocity;
                this.y += Math.sin(moveAngle) * this.velocity;

                this.spine[0].x = this.x;
                this.spine[0].y = this.y;
                this.spine[0].angle = moveAngle;

                for (let i = 1; i < this.numSegs; i++) {
                    const prev = this.spine[i - 1];
                    const curr = this.spine[i];

                    const sdx = prev.x - curr.x;
                    const sdy = prev.y - curr.y;
                    let segAngle = Math.atan2(sdy, sdx);

                    const ratio = i / this.numSegs;
                    const waveAmp = Math.pow(ratio, 1.4) * 0.1 * (0.55 + (this.velocity / this.scale) * 0.1);
                    const muscularOffset = Math.sin(this.swimCycle - i * 0.31) * waveAmp;

                    segAngle += muscularOffset;

                    let rel = normAngle(segAngle - prev.angle);
                    const maxBend = 0.21;
                    if (rel > maxBend) segAngle = prev.angle + maxBend;
                    if (rel < -maxBend) segAngle = prev.angle - maxBend;

                    curr.angle = segAngle;
                    curr.x = prev.x - Math.cos(segAngle) * this.segLen;
                    curr.y = prev.y - Math.sin(segAngle) * this.segLen;
                }

                if (Math.random() < 0.14) {
                    const tail = this.spine[this.numSegs - 4];
                    wakeBubbles.push({
                        x: tail.x + (Math.random() - 0.5) * 12 * this.scale,
                        y: tail.y + (Math.random() - 0.5) * 12 * this.scale,
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: (Math.random() - 0.5) * 0.6,
                        r: (Math.random() * 2.1 + 0.7) * this.scale,
                        alpha: 0.65 * this.entranceAlpha,
                        color: [...curPal.glow]
                    });
                }
                if (Math.random() < 0.03) {
                    const g = curPal.glow;
                    waterRipples.push(new WaterRipple(this.x, this.y, 70 * this.scale, 1.1, `${Math.round(g[0])}, ${Math.round(g[1])}, ${Math.round(g[2])}`));
                }
            }

            drawSilkPectoralFin(segIdx, side) {
                const joint = this.spine[segIdx];
                const perp = joint.angle + side * (Math.PI / 2);
                const ax = joint.x + Math.cos(perp) * (this.profile[segIdx] * 0.78);
                const ay = joint.y + Math.sin(perp) * (this.profile[segIdx] * 0.78);

                const speedTuck = Math.min(0.28, (this.velocity / this.scale) * 0.03);
                const featherWave = Math.sin(this.finCycle - side * 0.45) * 0.24;
                const finAng = joint.angle + side * (1.72 + speedTuck + featherWave);

                ctx.save();
                ctx.translate(ax, ay);
                ctx.rotate(finAng);
                ctx.scale(this.scale, side * this.scale);

                const fLen = 72;
                const fWid = 40;

                const grad = ctx.createRadialGradient(0, 0, 4, fLen * 0.5, fWid * 0.2, fLen * 1.05);
                grad.addColorStop(0, rgba(curPal.base2, 0.85));
                grad.addColorStop(0.4, rgba(curPal.fin, 0.58));
                grad.addColorStop(0.8, rgba(curPal.tail, 0.22));
                grad.addColorStop(1, rgba(curPal.fin, 0));

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(fLen * 0.35, -fWid * 0.45, fLen * 0.8, -fWid * 0.25, fLen, fWid * 0.12);
                ctx.bezierCurveTo(fLen * 0.82, fWid * 0.88, fLen * 0.35, fWid * 1.08, 0, 6);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = rgba(curPal.base1, 0.34);
                ctx.lineWidth = 0.85;
                for (let r = 0; r < 10; r++) {
                    const t = r / 9;
                    const rayWave = Math.sin(this.finCycle * 1.2 + r * 0.4) * 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(
                        fLen * 0.48,
                        -fWid * 0.18 + t * fWid * 0.65,
                        fLen * (0.98 - t * 0.28),
                        -fWid * 0.05 + t * fWid * 0.92 + rayWave
                    );
                    ctx.stroke();
                }

                ctx.strokeStyle = rgba(curPal.base1, 0.8);
                ctx.lineWidth = 1.7;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(fLen * 0.35, -fWid * 0.45, fLen * 0.8, -fWid * 0.25, fLen, fWid * 0.12);
                ctx.stroke();

                ctx.restore();
            }

            drawPelvicFin(segIdx, side) {
                const joint = this.spine[segIdx];
                const perp = joint.angle + side * (Math.PI / 2);
                const ax = joint.x + Math.cos(perp) * (this.profile[segIdx] * 0.72);
                const ay = joint.y + Math.sin(perp) * (this.profile[segIdx] * 0.72);

                const wave = Math.sin(this.finCycle - 1.4) * 0.22;
                const ang = joint.angle + side * (2.05 + wave);

                ctx.save();
                ctx.translate(ax, ay);
                ctx.rotate(ang);
                ctx.scale(this.scale, side * this.scale);

                const fLen = 42;
                const fWid = 22;
                const grad = ctx.createRadialGradient(0, 0, 2, fLen * 0.5, 0, fLen);
                grad.addColorStop(0, rgba(curPal.base2, 0.72));
                grad.addColorStop(0.55, rgba(curPal.fin, 0.4));
                grad.addColorStop(1, rgba(curPal.fin, 0));

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(fLen * 0.6, -fWid * 0.35, fLen, fWid * 0.15);
                ctx.quadraticCurveTo(fLen * 0.5, fWid * 0.9, 0, 4);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            drawButterflyVeilTail() {
                const base = this.spine[this.numSegs - 7];
                const mid = this.spine[this.numSegs - 4];
                const tip = this.spine[this.numSegs - 1];

                const tailDir = tip.angle + Math.PI;
                const perp = tailDir + Math.PI / 2;

                const whip1 = Math.sin(this.swimCycle - 2.7) * 34 * this.scale;
                const whip2 = Math.cos(this.swimCycle - 3.2) * 38 * this.scale;
                const tailLen = 102 * this.scale;

                const topLobe = {
                    x: tip.x + Math.cos(tailDir + 0.45) * tailLen + Math.cos(perp) * whip1,
                    y: tip.y + Math.sin(tailDir + 0.45) * tailLen + Math.sin(perp) * whip1
                };
                const botLobe = {
                    x: tip.x + Math.cos(tailDir - 0.45) * tailLen + Math.cos(perp) * whip2,
                    y: tip.y + Math.sin(tailDir - 0.45) * tailLen + Math.sin(perp) * whip2
                };
                const innerFork = {
                    x: tip.x + Math.cos(tailDir) * (tailLen * 0.62) + Math.cos(perp) * ((whip1 + whip2) * 0.5),
                    y: tip.y + Math.sin(tailDir) * (tailLen * 0.62) + Math.sin(perp) * ((whip1 + whip2) * 0.5)
                };

                ctx.save();
                const tGrad = ctx.createRadialGradient(base.x, base.y, 6 * this.scale, tip.x, tip.y, tailLen * 1.2);
                tGrad.addColorStop(0, rgba(curPal.base2, 0.88));
                tGrad.addColorStop(0.38, rgba(curPal.tail, 0.6));
                tGrad.addColorStop(0.78, rgba(curPal.fin, 0.3));
                tGrad.addColorStop(1, rgba(curPal.fin, 0));

                ctx.fillStyle = tGrad;
                ctx.beginPath();
                ctx.moveTo(base.x, base.y);
                ctx.bezierCurveTo(
                    mid.x + Math.cos(perp) * 24 * this.scale, mid.y + Math.sin(perp) * 24 * this.scale,
                    tip.x + Math.cos(perp) * 36 * this.scale, tip.y + Math.sin(perp) * 36 * this.scale,
                    topLobe.x, topLobe.y
                );
                ctx.quadraticCurveTo(innerFork.x, innerFork.y, botLobe.x, botLobe.y);
                ctx.bezierCurveTo(
                    tip.x - Math.cos(perp) * 36 * this.scale, tip.y - Math.sin(perp) * 36 * this.scale,
                    mid.x - Math.cos(perp) * 24 * this.scale, mid.y - Math.sin(perp) * 24 * this.scale,
                    base.x, base.y
                );
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = rgba(curPal.base1, 0.32);
                ctx.lineWidth = 0.9 * this.scale;
                const numRays = 15;
                for (let i = 0; i <= numRays; i++) {
                    const t = i / numRays;
                    const rx = topLobe.x * (1 - t) + botLobe.x * t;
                    const ry = topLobe.y * (1 - t) + botLobe.y * t;
                    ctx.beginPath();
                    ctx.moveTo(base.x, base.y);
                    ctx.quadraticCurveTo(innerFork.x * 0.45 + tip.x * 0.55, innerFork.y * 0.45 + tip.y * 0.55, rx, ry);
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawFlowingDorsalFin() {
                const start = 5;
                const end = 23;
                ctx.save();

                const pStart = this.spine[start];
                const pEnd = this.spine[end];
                const dGrad = ctx.createLinearGradient(pStart.x, pStart.y, pEnd.x, pEnd.y);
                dGrad.addColorStop(0, rgba(curPal.base1, 0.8));
                dGrad.addColorStop(0.5, rgba(curPal.fin, 0.54));
                dGrad.addColorStop(1, rgba(curPal.tail, 0.08));

                ctx.fillStyle = dGrad;
                ctx.strokeStyle = rgba(curPal.base1, 0.6);
                ctx.lineWidth = 1.25 * this.scale;

                const crestPoints = [];
                ctx.beginPath();
                for (let i = start; i <= end; i++) {
                    const s = this.spine[i];
                    if (i === start) ctx.moveTo(s.x, s.y);
                    else ctx.lineTo(s.x, s.y);
                }
                for (let i = end; i >= start; i--) {
                    const s = this.spine[i];
                    const norm = (i - start) / (end - start);
                    const height = Math.sin(norm * Math.PI) * 32 * this.scale;
                    const sway = Math.sin(this.swimCycle - i * 0.4) * height;
                    const perp = s.angle + Math.PI / 2;
                    const cx = s.x + Math.cos(perp) * sway;
                    const cy = s.y + Math.sin(perp) * sway;
                    crestPoints.push({ sx: s.x, sy: s.y, cx, cy });
                    ctx.lineTo(cx, cy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = rgba(curPal.base1, 0.26);
                ctx.lineWidth = 0.75 * this.scale;
                crestPoints.forEach((pt, idx) => {
                    if (idx % 2 === 0) {
                        ctx.beginPath();
                        ctx.moveTo(pt.sx, pt.sy);
                        ctx.lineTo(pt.cx, pt.cy);
                        ctx.stroke();
                    }
                });

                ctx.restore();
            }

            draw() {
                updateColors();
                ctx.save();
                ctx.globalAlpha = this.entranceAlpha;

                // 1. Deep 3D Underwater Shadow
                ctx.save();
                ctx.translate(16 * this.scale, 26 * this.scale);
                const shPts = [];
                for (let i = 0; i < this.numSegs; i++) {
                    const s = this.spine[i];
                    const p = s.angle - Math.PI / 2;
                    shPts.push({ x: s.x + Math.cos(p) * this.profile[i], y: s.y + Math.sin(p) * this.profile[i] });
                }
                for (let i = this.numSegs - 1; i >= 0; i--) {
                    const s = this.spine[i];
                    const p = s.angle + Math.PI / 2;
                    shPts.push({ x: s.x + Math.cos(p) * this.profile[i], y: s.y + Math.sin(p) * this.profile[i] });
                }
                drawCatmullClosed(ctx, shPts);
                ctx.fillStyle = 'rgba(0, 3, 10, 0.58)';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 30 * this.scale;
                ctx.fill();
                ctx.restore();

                // 2. Underneath Fins
                this.drawSilkPectoralFin(4, -1);
                this.drawSilkPectoralFin(4, 1);
                this.drawPelvicFin(12, -1);
                this.drawPelvicFin(12, 1);
                this.drawButterflyVeilTail();

                // 3. Smooth Anatomical Body Contour
                const leftSide = [];
                const rightSide = [];
                for (let i = 0; i < this.numSegs; i++) {
                    const s = this.spine[i];
                    const w = this.profile[i];
                    leftSide.push({
                        x: s.x + Math.cos(s.angle - Math.PI / 2) * w,
                        y: s.y + Math.sin(s.angle - Math.PI / 2) * w
                    });
                    rightSide.push({
                        x: s.x + Math.cos(s.angle + Math.PI / 2) * w,
                        y: s.y + Math.sin(s.angle + Math.PI / 2) * w
                    });
                }

                const head = this.spine[0];
                const snoutExtend = (11.5 + this.mouthOpen * 3.5) * this.scale;
                const snout = {
                    x: head.x + Math.cos(head.angle) * snoutExtend,
                    y: head.y + Math.sin(head.angle) * snoutExtend
                };

                if (this.mouthOpen > 0.05) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                    ctx.strokeStyle = rgba(curPal.base1, 0.8);
                    ctx.lineWidth = 1.5 * this.scale;
                    ctx.beginPath();
                    ctx.arc(snout.x, snout.y, 4.5 * this.mouthOpen * this.scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                const contour = [snout, ...rightSide, ...leftSide.reverse()];

                // 4. Fill Body Base + Clip for Markings
                ctx.save();
                drawCatmullClosed(ctx, contour);

                const tailEnd = this.spine[this.numSegs - 1];
                const bodyGrad = ctx.createLinearGradient(snout.x, snout.y, tailEnd.x, tailEnd.y);
                bodyGrad.addColorStop(0, rgba(curPal.base1, 0.99));
                bodyGrad.addColorStop(0.38, rgba(curPal.base1, 0.96));
                bodyGrad.addColorStop(0.78, rgba(curPal.base2, 0.92));
                bodyGrad.addColorStop(1, rgba(curPal.tail, 0.45));

                ctx.shadowColor = rgba(curPal.glow, 0.42);
                ctx.shadowBlur = 22 * this.scale;
                ctx.fillStyle = bodyGrad;
                ctx.fill();

                ctx.clip();
                ctx.shadowBlur = 0;

                // 4A. Organic Kohaku Markings
                this.patches.forEach(p => {
                    const s = this.spine[p.seg];
                    const perp = s.angle + Math.PI / 2;
                    const px = s.x + Math.cos(perp) * (this.profile[p.seg] * p.sideOffset);
                    const py = s.y + Math.sin(perp) * (this.profile[p.seg] * p.sideOffset);
                    const rx = p.rx * this.scale;
                    const ry = p.ry * this.scale;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(s.angle);
                    const pGrad = ctx.createRadialGradient(0, 0, rx * 0.15, 0, 0, rx);
                    pGrad.addColorStop(0, rgba(curPal.patch, 0.94));
                    pGrad.addColorStop(0.78, rgba(curPal.patch, 0.68));
                    pGrad.addColorStop(1, rgba(curPal.patch, 0));
                    ctx.fillStyle = pGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 4B. Shimmering Overlapping Scales
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
                ctx.lineWidth = 0.85 * this.scale;
                for (let i = 3; i < this.numSegs - 5; i++) {
                    const s = this.spine[i];
                    const w = this.profile[i];
                    const perp = s.angle + Math.PI / 2;
                    const cols = i < 15 ? 3 : 2;
                    for (let c = -cols + 1; c < cols; c++) {
                        const off = (c / cols) * w * 0.64 + ((i % 2) * 2.8 - 1.4) * this.scale;
                        const sx = s.x + Math.cos(perp) * off;
                        const sy = s.y + Math.sin(perp) * off;
                        const sr = Math.max(2.4 * this.scale, w * 0.21);
                        ctx.beginPath();
                        ctx.arc(sx, sy, sr, s.angle + Math.PI - 0.82, s.angle + Math.PI + 0.82);
                        ctx.stroke();
                    }
                }

                // 4C. 3D Cylindrical Rim Shading
                ctx.strokeStyle = 'rgba(2, 8, 22, 0.45)';
                ctx.lineWidth = 7.5 * this.scale;
                drawCatmullClosed(ctx, contour);
                ctx.stroke();

                // 4D. Glossy Wet Dorsal Spine Ridge
                ctx.beginPath();
                for (let i = 1; i < this.numSegs - 7; i++) {
                    const s = this.spine[i];
                    if (i === 1) ctx.moveTo(s.x, s.y);
                    else ctx.lineTo(s.x, s.y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.36)';
                ctx.lineWidth = 7 * this.scale;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 4E. Breathing Gill Plates
                const gillSeg = this.spine[2];
                const breathOpen = Math.sin(this.finCycle * 1.5) * 1.3 * this.scale;
                [-1, 1].forEach(side => {
                    const gPerp = gillSeg.angle + side * (Math.PI / 2);
                    const gx = gillSeg.x + Math.cos(gPerp) * (this.profile[2] * 0.62 + breathOpen);
                    const gy = gillSeg.y + Math.sin(gPerp) * (this.profile[2] * 0.62 + breathOpen);
                    ctx.strokeStyle = 'rgba(10, 20, 35, 0.45)';
                    ctx.lineWidth = 1.9 * this.scale;
                    ctx.beginPath();
                    ctx.arc(gx, gy, 8.8 * this.scale, gillSeg.angle + Math.PI - 0.65, gillSeg.angle + Math.PI + 0.65);
                    ctx.stroke();
                });

                ctx.restore();

                // 5. Sensory Koi Barbels (Whiskers)
                [-1, 1].forEach(side => {
                    const bPerp = head.angle + side * (Math.PI / 2);
                    const bx = snout.x - Math.cos(head.angle) * 3 * this.scale + Math.cos(bPerp) * 6 * this.scale;
                    const by = snout.y - Math.sin(head.angle) * 3 * this.scale + Math.sin(bPerp) * 6 * this.scale;
                    const bSway = Math.sin(this.swimCycle - side) * 0.25;
                    const bAng = head.angle + side * (0.62 + bSway);
                    ctx.strokeStyle = rgba(curPal.base2, 0.92);
                    ctx.lineWidth = 1.6 * this.scale;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.quadraticCurveTo(
                        bx + Math.cos(head.angle + side * 0.25) * 10 * this.scale,
                        by + Math.sin(head.angle + side * 0.25) * 10 * this.scale,
                        bx + Math.cos(bAng) * 19 * this.scale,
                        by + Math.sin(bAng) * 19 * this.scale
                    );
                    ctx.stroke();
                });

                // 6. Realistic 3D Eyes
                const eyeSeg = this.spine[1];
                [-1, 1].forEach(side => {
                    const ePerp = eyeSeg.angle + side * (Math.PI / 2);
                    const ex = eyeSeg.x + Math.cos(ePerp) * (this.profile[1] * 0.78);
                    const ey = eyeSeg.y + Math.sin(ePerp) * (this.profile[1] * 0.78);

                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(ex, ey, 4.1 * this.scale, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#020617';
                    ctx.beginPath();
                    ctx.arc(ex + Math.cos(eyeSeg.angle) * 0.7 * this.scale, ey + Math.sin(eyeSeg.angle) * 0.7 * this.scale, 2.5 * this.scale, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ex + Math.cos(eyeSeg.angle - 0.5) * 1.3 * this.scale, ey + Math.sin(eyeSeg.angle - 0.5) * 1.3 * this.scale, 1.1 * this.scale, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 7. Top Flowing Dorsal Ribbon Fin
                this.drawFlowingDorsalFin();

                ctx.restore();
            }
        }

        const koi = new UltraRealisticKoi();

        // Tap / Click on Water to drop a Bio-Pellet for the Koi to eat
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.nav-trigger')) return;
            if (foodPellets.length < 4) {
                foodPellets.push(new FoodPellet(e.clientX, e.clientY));
            }
            waterRipples.push(new WaterRipple(e.clientX, e.clientY, 110, 2.2, '0, 245, 212'));
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            koi.updateScale();
            initEcosystem();
        });

        /* ==========================================================
           6. MAIN RENDER LOOP
        ========================================================== */
        function animate(timestamp) {
            const time = timestamp * 0.001;

            const bgGrad = ctx.createRadialGradient(
                viewW * 0.5 + Math.cos(time * 0.3) * 110,
                viewH * 0.4 + Math.sin(time * 0.25) * 80,
                30,
                viewW * 0.5,
                viewH * 0.5,
                Math.max(viewW, viewH) * 0.9
            );
            bgGrad.addColorStop(0, '#071b34');
            bgGrad.addColorStop(0.55, '#030b18');
            bgGrad.addColorStop(1, '#01040a');

            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, viewW, viewH);

            const spotGrad = ctx.createRadialGradient(mouse.x, mouse.y, 10, mouse.x, mouse.y, 340);
            spotGrad.addColorStop(0, rgba(curPal.glow, 0.065));
            spotGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = spotGrad;
            ctx.fillRect(0, 0, viewW, viewH);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update(koi.spine[0]);
                particlesArray[i].draw();

                for (let j = i + 1; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 155) {
                        const alpha = Math.pow(1 - dist / 155, 2) * 0.18;
                        ctx.strokeStyle = `rgba(0, 245, 212, ${alpha})`;
                        ctx.lineWidth = 0.45;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }

            for (let i = waterRipples.length - 1; i >= 0; i--) {
                waterRipples[i].update();
                waterRipples[i].draw();
                if (waterRipples[i].alpha <= 0.01) waterRipples.splice(i, 1);
            }

            for (let i = 0; i < foodPellets.length; i++) {
                foodPellets[i].update();
                foodPellets[i].draw();
            }

            for (let i = wakeBubbles.length - 1; i >= 0; i--) {
                const b = wakeBubbles[i];
                b.x += b.vx;
                b.y += b.vy;
                b.alpha -= 0.015;
                if (b.alpha <= 0) {
                    wakeBubbles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.fillStyle = rgba(b.color, b.alpha);
                ctx.shadowColor = rgba(b.color, b.alpha);
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            koi.update(time);
            koi.draw();

            for (let i = 0; i < floatingPetals.length; i++) {
                floatingPetals[i].update(koi.spine[0]);
                floatingPetals[i].draw();
            }

            requestAnimationFrame(animate);
        }

        // Trigger the smooth Benzene, Typography & Koi entrance transition
        window.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(animate);
            setTimeout(() => {
                mainScene.classList.add('active');
                waterRipples.push(new WaterRipple(viewW * 0.5, viewH * 0.36, 180, 1.8, '0, 245, 212'));
                waterRipples.push(new WaterRipple(viewW * 0.5, viewH * 0.36, 110, 1.2, '0, 187, 249'));
            }, 120);
        });

        /* ==========================================================
           7. WATERFALL NAVIGATION TRIGGER
        ========================================================== */
        const navButtons = document.querySelectorAll('.nav-trigger');
        const waterfallOverlay = document.getElementById('waterfall-overlay');

        navButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetPage = btn.getAttribute('data-target');
                waterfallOverlay.classList.add('active');
                setTimeout(() => {
                    window.location.href = targetPage;
                }, 1500);
            });
        });
    </script>
</body>
</html>
