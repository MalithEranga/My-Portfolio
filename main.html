<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Malith Eranga</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syncopate:wght@600&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #3b82f6;
    --secondary: #00ffcc; 
    --accent-pink: #ec4899;
    --bg-overlay: rgba(4, 8, 18, 0);
    --text-main: #f8fafc;
    --text-muted: #cbd5e1;
    --bot-main: #0f172a;
    --bot-light: #1e293b;
    --bot-glow: #00ffcc;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes fadeInPage { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes navSlideDown { 0% { opacity: 0; transform: translate(-50%, -30px); } 100% { opacity: 1; transform: translate(-50%, 0); } }

html { background-color: #030712; width: 100%; height: 100%; scroll-behavior: smooth; }

body {
    width: 100%; min-height: 100%;
    background-color: #030712; 
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text-main);
    overflow-x: hidden;
    opacity: 0;
    animation: fadeInPage 1.6s ease-in-out forwards;
}

/* ===================================================
   HERO SECTION (NO-CROP RESPONSIVE IMAGE PROTECTION)
   =================================================== */
.hero-section {
    position: relative;
    width: 100%;
    min-height: 800px;
    aspect-ratio: 16 / 9;
    background-color: #030712;
    background-image: url('Backgrounds/background1.webp');
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    overflow: hidden;
}

@media (min-width: 1200px) {
    .hero-section {
        min-height: 100vh;
        background-size: cover;
        background-position: center top;
    }
}

.top-nav {
    position: fixed; top: 30px; left: 50%; z-index: 100;
    background: rgba(15, 23, 42, 0.35);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-bottom: 2px solid var(--secondary); 
    border-radius: 30px; padding: 10px 30px; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    opacity: 0;
    animation: navSlideDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; 
    max-width: 94vw;
}

.top-nav ul { list-style: none; display: flex; gap: 25px; align-items: center; }
.top-nav li a {
    text-decoration: none; color: var(--text-muted); font-size: 0.75rem; 
    font-weight: 600; text-transform: uppercase; letter-spacing: 2px; 
    transition: all 0.4s ease; position: relative; padding: 5px 0; white-space: nowrap;
}
.top-nav li a:hover, .top-nav li a.active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
.top-nav li a::after {
    content: ''; position: absolute; width: 4px; height: 4px; bottom: -2px; left: 50%;
    transform: translateX(-50%) scale(0); background-color: var(--secondary); 
    border-radius: 50%; transition: transform 0.3s ease; box-shadow: 0 0 8px var(--secondary);
}
.top-nav li a:hover::after, .top-nav li a.active::after { transform: translateX(-50%) scale(1); }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #030712; }
::-webkit-scrollbar-thumb { background-color: rgba(30,41,59,0.8); border-radius: 10px; transition: all 0.4s ease; }
::-webkit-scrollbar-thumb:hover { background-color: var(--secondary); }

#starsCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; mix-blend-mode: screen; }

/* ===================================================
   REALISTIC PROFESSOR CHALKBOARD SECTION (NO EXTRA TEXT)
   =================================================== */
.chem-arena-section {
    position: relative;
    width: 100%;
    height: 350px;
    background: #0a0f18;
    border-top: 8px solid #3e2723;
    border-bottom: 12px solid #4e342e;
    box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.85), 0 10px 25px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}

#chemGalleryCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

.Projects-iframe { width: 100%; border: none; position: relative; z-index: 20; display: block; overflow: hidden; }

/* =========================================
   ADVANCED TORA 2.0 CYBER ROBOT
   ========================================= */
#chuti-bot {
    position: fixed; bottom: 30px; right: 40px;
    width: 82px; height: 105px;
    z-index: 1000; pointer-events: auto; cursor: pointer;      
    filter: drop-shadow(0 12px 20px rgba(0,0,0,0.75));
}

.chuti-name {
    position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
    font-family: 'Syncopate', sans-serif; font-size: 8.5px; font-weight: 600;
    color: var(--secondary); letter-spacing: 2px; text-shadow: 0 0 8px var(--secondary);
    background: rgba(4, 8, 18, 0.8);
    border: 1px solid rgba(0, 255, 204, 0.35);
    padding: 3px 8px; border-radius: 12px;
    white-space: nowrap;
    opacity: 0.95; z-index: 20; transition: all 0.4s ease;
}

.chuti-halo {
    position: absolute; top: 38px; left: 50%;
    width: 76px; height: 22px;
    margin-left: -38px;
    border-radius: 50%;
    border: 1.5px dashed rgba(0, 255, 204, 0.45);
    box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
    transform: rotateX(65deg);
    animation: haloSpin 6s linear infinite;
    pointer-events: none;
    z-index: 12;
}

@keyframes haloSpin {
    0% { transform: rotateX(65deg) rotateZ(0deg); }
    100% { transform: rotateX(65deg) rotateZ(360deg); }
}

.chuti-shadow {
    position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
    width: 54px; height: 10px; background: radial-gradient(circle, rgba(0,255,204,0.45) 0%, transparent 75%);
    border-radius: 50%; filter: blur(3px);
    animation: chutiShadowPulse 3s ease-in-out infinite; transition: background 0.4s ease;
}

.chuti-wrapper { position: relative; width: 100%; height: 100%; animation: chutiFloat 3.2s ease-in-out infinite; }

.chuti-body, .chuti-head, .chuti-arm, .chuti-leg, .chuti-ear, .chuti-core, .chuti-eye {
    transition: all 0.35s ease;
}

.chuti-antenna {
    position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 11px;
    background: linear-gradient(to top, #64748b, #cbd5e1);
    z-index: 9;
}
.chuti-antenna::after {
    content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--secondary);
    box-shadow: 0 0 10px var(--secondary), 0 0 18px #fff;
    animation: antennaPulse 1.5s infinite alternate;
}
@keyframes antennaPulse {
    0% { transform: translateX(-50%) scale(0.85); opacity: 0.7; }
    100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
}

.chuti-body {
    position: absolute; top: 50px; left: 50%; margin-left: -21px;
    width: 42px; height: 36px;
    background: linear-gradient(145deg, #f8fafc 0%, #cbd5e1 45%, #475569 100%);
    border-radius: 16px 16px 14px 14px; border: 1.5px solid rgba(0, 255, 204, 0.45);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 5;
}

.chuti-core {
    width: 15px; height: 15px;
    background: radial-gradient(circle, #ffffff 15%, var(--secondary) 60%, #0284c7 100%);
    border-radius: 50%;
    border: 1.5px solid #0f172a;
    box-shadow: 0 0 14px var(--secondary), inset 0 0 4px #fff;
    animation: heartBeat 1.8s infinite;
}

.chuti-head {
    position: absolute; top: 6px; left: 50%; margin-left: -32px;
    width: 64px; height: 44px;
    background: linear-gradient(145deg, #ffffff 0%, #e2e8f0 55%, #64748b 100%);
    border-radius: 24px 24px 20px 20px; border: 1.5px solid rgba(0, 255, 204, 0.55);
    box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 2px 6px #fff;
    z-index: 10; display: flex; justify-content: center; align-items: center;
    will-change: transform; transform-origin: center bottom;
}

.chuti-visor {
    width: 84%; height: 27px; background: radial-gradient(circle at 50% 30%, #0f172a, #020617);
    border-radius: 13px; border: 1.5px solid #334155;
    box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.2);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow: hidden; position: relative;
}

.chuti-visor::before {
    content: ''; position: absolute; top: 2px; left: 8px;
    width: 45%; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(255,255,255,0.35), transparent);
    pointer-events: none;
}

.chuti-eyes-container { display: flex; gap: 13px; will-change: transform; align-items: center; }

.chuti-eye {
    width: 9px; height: 12px; background: var(--secondary);
    border-radius: 10px; box-shadow: 0 0 10px var(--secondary), 0 0 18px #fff;
    animation: cuteBlink 4s infinite;
    position: relative;
}

.chuti-eye::after {
    content: ''; position: absolute; top: 2px; right: 2px;
    width: 3px; height: 3px; border-radius: 50%; background: #fff;
}

#chuti-bot.mood-happy .chuti-eye {
    height: 6px; border-radius: 10px 10px 2px 2px;
    background: #22c55e; box-shadow: 0 0 12px #22c55e;
}
#chuti-bot.mood-thinking .chuti-eye:first-child { height: 6px; }
#chuti-bot.mood-thinking .chuti-eye:last-child { height: 13px; background: #38bdf8; }

.chuti-voice-wave {
    display: flex; gap: 2px; align-items: center; height: 4px; margin-top: 2px; opacity: 0.4;
}
.chuti-voice-wave span {
    width: 2.5px; height: 2px; background: var(--secondary); border-radius: 2px;
    transition: height 0.15s ease;
}
#chuti-bot.is-talking .chuti-voice-wave { opacity: 1; }
#chuti-bot.is-talking .chuti-voice-wave span {
    animation: voiceWaveAnim 0.35s infinite alternate;
}
#chuti-bot.is-talking .chuti-voice-wave span:nth-child(2) { animation-delay: 0.1s; }
#chuti-bot.is-talking .chuti-voice-wave span:nth-child(3) { animation-delay: 0.2s; }
@keyframes voiceWaveAnim { 0% { height: 2px; } 100% { height: 6px; } }

.chuti-cheek { position: absolute; bottom: 3px; width: 7px; height: 3.5px; background: rgba(244,63,94,0.75); border-radius: 5px; filter: blur(1px); }
.chuti-cheek.left { left: 5px; }
.chuti-cheek.right { right: 5px; }

.chuti-ear {
    position: absolute; top: 13px; width: 7px; height: 16px;
    background: linear-gradient(to bottom, var(--secondary), #0284c7);
    border-radius: 4px; box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
}
.chuti-ear.left { left: -6px; border-radius: 6px 0 0 6px; }
.chuti-ear.right { right: -6px; border-radius: 0 6px 6px 0; }

.chuti-arm {
    position: absolute; top: 53px; width: 11px; height: 25px;
    background: linear-gradient(145deg, #f1f5f9, #64748b);
    border-radius: 8px; border: 1.5px solid rgba(0, 255, 204, 0.4); z-index: 6;
    animation: armSwing 3s ease-in-out infinite;
}
.chuti-arm.left { left: 6px; transform-origin: top center; }
.chuti-arm.right { right: 6px; transform-origin: top center; animation-delay: 1.5s; }

.chuti-leg {
    position: absolute; bottom: 4px; width: 12px; height: 16px;
    background: linear-gradient(to bottom, #334155, #0f172a);
    border-radius: 4px 4px 8px 8px;
    border: 1px solid var(--secondary); z-index: 4;
    animation: legDangle 3s ease-in-out infinite;
}
.chuti-leg::after {
    content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 7px; border-radius: 0 0 50% 50%;
    background: linear-gradient(to bottom, #00ffcc, transparent);
    filter: blur(1px);
}
.chuti-leg.left { left: 24px; transform-origin: top center; }
.chuti-leg.right { right: 24px; transform-origin: top center; animation-delay: 1.5s; }

#chuti-bot.tora-active .chuti-name { color: #00ffcc; border-color: #00ffcc; box-shadow: 0 0 12px rgba(0,255,204,0.4); } 
#chuti-bot.tora-active .chuti-head { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.35), inset 0 2px 6px #fff; }
#chuti-bot.tora-active .chuti-body { border-color: #00ffcc; }
#chuti-bot.tora-active .chuti-arm.right { animation: waveHand 0.6s ease-in-out infinite alternate; }

@keyframes waveHand {
    0% { transform: rotate(-25deg); }
    100% { transform: rotate(-115deg); }
}

@keyframes chutiFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes chutiShadowPulse { 0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; } 50% { transform: translateX(-50%) scale(0.68); opacity: 0.35; } }
@keyframes cuteBlink { 0%, 90%, 94%, 100% { transform: scaleY(1); } 92%, 96% { transform: scaleY(0.1); } }
@keyframes heartBeat { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.18); opacity: 1; box-shadow: 0 0 18px var(--secondary); } }
@keyframes armSwing { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } }
@keyframes legDangle { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }

/* =========================================
   ADVANCED TORA 2.0 CHAT PANEL
   ========================================= */
.tora-chat-panel {
    position: fixed;
    bottom: 145px; right: 30px;
    width: 360px; height: 500px;
    background: rgba(4, 9, 24, 0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 255, 204, 0.4);
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 35px rgba(0,255,204,0.15);
    font-family: 'Space Grotesk', sans-serif;
    opacity: 0; pointer-events: none;
    transform: translateY(20px) scale(0.92);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 2000;
    display: flex; flex-direction: column; overflow: hidden;
}
.tora-chat-panel.show { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

.tora-header {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 15px;
    background: linear-gradient(90deg, rgba(0,255,204,0.1), rgba(59,130,246,0.08));
    border-bottom: 1px solid rgba(0,255,204,0.2);
    flex-shrink: 0;
}
.tora-avatar {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #00ffcc, #3b82f6);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 0 0 12px rgba(0,255,204,0.45); flex-shrink: 0;
}
.tora-header-name { font-family: 'Syncopate', sans-serif; font-size: 11px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.tora-header-status { font-size: 10.5px; color: var(--secondary); margin-top: 2px; }
.tora-header-info { flex: 1; }

.tora-icon-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #94a3b8; cursor: pointer;
    font-size: 13px; padding: 4px 8px; border-radius: 8px; transition: all 0.2s; line-height: 1;
}
.tora-icon-btn:hover { color: #fff; border-color: var(--secondary); background: rgba(0,255,204,0.12); }
.tora-close-btn:hover { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,0.12); }

.tora-messages {
    flex: 1; overflow-y: auto;
    padding: 14px 12px; display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
}
.tora-messages::-webkit-scrollbar { width: 4px; }
.tora-messages::-webkit-scrollbar-track { background: transparent; }
.tora-messages::-webkit-scrollbar-thumb { background: rgba(0,255,204,0.3); border-radius: 99px; }

.t-msg { display: flex; gap: 8px; align-items: flex-end; animation: msgPop 0.3s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes msgPop { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
.t-msg.user { flex-direction: row-reverse; }

.t-msg-icon { width: 25px; height: 25px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.t-msg-icon.bot { background: linear-gradient(135deg, #00ffcc, #3b82f6); color: #020617; }
.t-msg-icon.user { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }

.t-bubble {
    max-width: 84%; padding: 9px 13px; border-radius: 13px;
    font-size: 12.5px; line-height: 1.55; word-break: break-word;
}
.t-msg.bot .t-bubble {
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(0, 255, 204, 0.22);
    color: #f1f5f9; border-bottom-left-radius: 3px;
}
.t-msg.user .t-bubble {
    background: linear-gradient(135deg, #00ffcc, #10b981);
    color: #022c22; font-weight: 600; border-bottom-right-radius: 3px;
}

.t-wiki-badge {
    display: inline-block; font-size: 9.5px; letter-spacing: 1px;
    text-transform: uppercase; color: #38bdf8;
    background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 2px 7px; border-radius: 6px; margin-bottom: 5px;
}

.t-action-btn {
    display: inline-block; margin-top: 7px; padding: 4px 10px;
    background: rgba(0, 255, 204, 0.14); border: 1px solid var(--secondary);
    color: var(--secondary); border-radius: 8px; font-size: 11px;
    font-weight: 600; cursor: pointer; text-decoration: none;
    transition: all 0.2s;
}
.t-action-btn:hover { background: var(--secondary); color: #020617; }

.typing-dots { background: rgba(15,23,42,0.9); border: 1px solid rgba(0,255,204,0.22); border-radius: 12px; border-bottom-left-radius: 3px; padding: 10px 14px; display: flex; gap: 4px; align-items: center; }
.typing-dots span { width: 5px; height: 5px; background: var(--secondary); border-radius: 50%; animation: dotBounce 1.1s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.18s; }
.typing-dots span:nth-child(3) { animation-delay: 0.36s; }
@keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity:0.4; } 30% { transform: translateY(-5px); opacity:1; } }

.tora-chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 12px 9px;
    scrollbar-width: none; flex-shrink: 0;
}
.tora-chips::-webkit-scrollbar { display: none; }
.t-chip {
    font-size: 11px; padding: 5px 11px; border-radius: 99px;
    background: rgba(0, 255, 204, 0.07); border: 1px solid rgba(0, 255, 204, 0.28);
    color: #a7f3d0; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    font-family: 'Space Grotesk', sans-serif; flex-shrink: 0;
}
.t-chip:hover { background: rgba(0, 255, 204, 0.2); color: #fff; border-color: var(--secondary); transform: translateY(-1px); }

.tora-input-area { padding: 9px 11px 12px; border-top: 1px solid rgba(0,255,204,0.15); background: rgba(2,6,23,0.6); flex-shrink: 0; }
.tora-input-row {
    display: flex; align-items: flex-end; gap: 7px;
    background: rgba(15,23,42,0.9); border: 1px solid rgba(0,255,204,0.3);
    border-radius: 12px; padding: 7px 9px 7px 13px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.tora-input-row:focus-within { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(0,255,204,0.12); }
#tora-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #f8fafc; font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px; resize: none; line-height: 1.5; max-height: 70px; overflow-y: auto;
}
#tora-input::placeholder { color: #64748b; }
.tora-send-btn {
    width: 31px; height: 31px; border-radius: 9px;
    background: linear-gradient(135deg, #00ffcc, #10b981);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(0,255,204,0.35);
}
.tora-send-btn:hover { transform: scale(1.08); box-shadow: 0 0 18px rgba(0,255,204,0.6); }
.tora-send-btn:active { transform: scale(0.95); }
.tora-send-btn svg { width: 13px; height: 13px; fill: #022c22; }

/* =========================================
   RESUME BUTTON
   ========================================= */
.resume-btn {
    position: fixed; top: 30px; right: 40px; z-index: 1000;
    padding: 12px 24px;
    background: rgba(15,23,42,0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0,255,204,0.5); border-radius: 10px;
    color: var(--text-main); font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 600; text-decoration: none;
    text-transform: uppercase; letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 0 10px rgba(0,255,204,0.2);
}
.resume-btn:hover {
    background: rgba(0,255,204,0.15); border-color: var(--secondary);
    box-shadow: 0 5px 20px rgba(0,255,204,0.4);
    transform: translateY(-3px) scale(1.05); color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.5);
}
.resume-btn::after {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,204,0.4), transparent);
    transition: all 0.5s ease;
}

// 1. OPTIMIZED HERO STARS ANIMATION (AUTO-PAUSES OFF-SCREEN)
// =========================================================
(function initHeroStars() {
    const canvas = document.getElementById('starsCanvas');
    const ctx    = canvas.getContext('2d', { alpha: true });
    const hero   = document.querySelector('.hero-section');
    let stars    = [];
    let heroVisible = true;

    function resize() {
        canvas.width = hero.offsetWidth;
        canvas.height = hero.offsetHeight;
        initStars();
    }

    function initStars() {
        stars = [];
        const isMobile = window.innerWidth < 768;
        const count = isMobile ? 75 : 140;
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.3,
                baseAlpha: Math.random() * 0.5 + 0.15,
                pulseSpeed: Math.random() * 0.02 + 0.005,
                angle: Math.random() * Math.PI * 2
            });
        }
    }

    const obs = new IntersectionObserver(entries => {
        heroVisible = entries[0].isIntersecting;
    }, { threshold: 0.01 });
    obs.observe(hero);

    function animateStars() {
        if (heroVisible && !document.hidden) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.angle += s.pulseSpeed;
                const alpha = Math.min(1, Math.max(0.05, s.baseAlpha + Math.sin(s.angle) * 0.45));
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
    animateStars();
})();

            ctx.lineTo(x2, y2);
            ctx.stroke();
        } else if (stroke.type === 'atom') {
            const ax = cx + stroke.x * sc;
            const ay = cy + stroke.y * sc;
            ctx.globalAlpha = Math.min(1, prog * 1.2);
            ctx.font = `600 ${Math.round(13.5 * sc)}px 'Space Grotesk', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(stroke.text, ax, ay);
        } else if (stroke.type === 'dots') {
            ctx.globalAlpha = Math.min(1, prog * 1.2);
            ctx.beginPath();
            ctx.arc(cx + stroke.x1 * sc, cy + stroke.y1 * sc, 1.8 * sc, 0, Math.PI * 2);
            ctx.arc(cx + stroke.x2 * sc, cy + stroke.y2 * sc, 1.8 * sc, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Get exact world coordinate of the chalk tip for the current stroke/writing action
    function getActiveChalkTarget(slot, sc) {
        if (!slot) return { x: cw * 0.5, y: ch * 0.5 };
        const comp = slot.compound;

        if (phase === 'DRAWING_MOL') {
            const st = comp.strokes[slot.drawnStrokes];
            if (!st) return { x: slot.x, y: slot.y };
            const p = slot.currentStrokeProg;
            if (st.type === 'line') {
                return {
                    x: slot.x + (st.x1 + (st.x2 - st.x1) * p) * sc,
                    y: slot.y + (st.y1 + (st.y2 - st.y1) * p) * sc
                };
            } else if (st.type === 'atom') {
                return {
                    x: slot.x + st.x * sc + Math.sin(p * Math.PI * 4) * 4 * sc,
                    y: slot.y + st.y * sc + Math.cos(p * Math.PI * 4) * 3 * sc
                };
            } else {
                return { x: slot.x + st.x1 * sc, y: slot.y + st.y1 * sc };
            }
        } else if (phase === 'WRITING_NAME') {
            // Writing the compound name and formula directly below the structure
            const labelW = 86 * sc;
            const writeX = (slot.x - labelW / 2) + labelW * slot.labelProg;
            const writeY = slot.y + (60 + (slot.labelProg > 0.55 ? 16 : 0)) * sc + Math.sin(slot.labelProg * 45) * 2.2 * sc;
            return { x: writeX, y: writeY };
        }
        return { x: slot.x, y: slot.y };
    }

    // --- Realistic Chemistry Professor Character ---
    const professor = {
        x: 90,
        y: floorY,
        targetX: 120,
        facing: 1,
        walkCycle: 0,
        isWalking: false,
        handTarget: { x: 120, y: 180 },
        usingChalk: false,
        usingEraser: false,

        update(dt) {
            this.y = floorY;
            const dx = this.targetX - this.x;
            const speed = (phase === 'ERASING' ? 5.2 : 2.2) * Math.max(0.75, scale) * dt;

            if (Math.abs(dx) > 3) {
                this.isWalking = true;
                this.facing = dx > 0 ? 1 : -1;
                this.x += Math.sign(dx) * Math.min(Math.abs(dx), speed);
                this.walkCycle += 0.11 * dt;
            } else {
                this.isWalking = false;
                this.walkCycle += 0.035 * dt;
            }
        },

        draw(ctx) {
            const sc = Math.max(0.78, scale);
            const t = this.walkCycle;
            const bounce = this.isWalking ? Math.abs(Math.sin(t)) * 2.4 * sc : Math.sin(t) * 0.9 * sc;
            const baseX = this.x;
            const baseY = this.y - bounce;

            ctx.save();

            // 1. Floor Shadow
            ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
            ctx.beginPath();
            ctx.ellipse(baseX, this.y - 2, 26 * sc, 5 * sc, 0, 0, Math.PI * 2);
            ctx.fill();

            // Leg Walk Angles
            let lHip = 0, rHip = 0;
            if (this.isWalking) {
                lHip = Math.sin(t) * 0.38;
                rHip = Math.sin(t + Math.PI) * 0.38;
            }

            const drawLeg = (offsetX, hipAngle, trouserCol) => {
                ctx.save();
                ctx.translate(baseX + offsetX * sc, baseY - 38 * sc);
                ctx.rotate(hipAngle * this.facing);
                // Slacks
                ctx.fillStyle = trouserCol;
                ctx.beginPath();
                ctx.roundRect(-5 * sc, 0, 10 * sc, 34 * sc, 4 * sc);
                ctx.fill();
                // Leather Oxford Shoes
                ctx.fillStyle = "#1c1917";
                ctx.beginPath();
                ctx.roundRect(this.facing > 0 ? -4 * sc : -10 * sc, 31 * sc, 14 * sc, 6 * sc, 3 * sc);
                ctx.fill();
                ctx.restore();
            };

            // Back Leg & Front Leg
            drawLeg(-3 * this.facing, lHip, "#1e293b");
            drawLeg(3 * this.facing, rHip, "#334155");

            // 2. Left Arm (Holds Chemistry Textbook / Notes while walking/drawing)
            ctx.save();
            ctx.translate(baseX - 6 * this.facing * sc, baseY - 76 * sc);
            ctx.rotate((this.isWalking ? Math.sin(t + Math.PI) * 0.25 : 0.22) * this.facing);
            ctx.fillStyle = "#e2e8f0";
            ctx.beginPath();
            ctx.roundRect(-4 * sc, 0, 8 * sc, 26 * sc, 4 * sc);
            ctx.fill();
            // Red Chemistry Reference Book in hand
            ctx.fillStyle = "#7f1d1d";
            ctx.strokeStyle = "#fde68a";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(-6 * sc, 20 * sc, 13 * sc, 16 * sc, 2 * sc);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // 3. Professor's Tailored White Lab Coat & Tweed Waistcoat
            const coatGrad = ctx.createLinearGradient(baseX - 14 * sc, baseY - 82 * sc, baseX + 14 * sc, baseY - 26 * sc);
            coatGrad.addColorStop(0, "#ffffff");
            coatGrad.addColorStop(0.65, "#f1f5f9");
            coatGrad.addColorStop(1, "#cbd5e1");
            ctx.fillStyle = coatGrad;
            ctx.beginPath();
            ctx.moveTo(baseX - 12 * sc, baseY - 82 * sc);
            ctx.lineTo(baseX + 12 * sc, baseY - 82 * sc);
            ctx.lineTo(baseX + 15 * sc, baseY - 26 * sc);
            ctx.lineTo(baseX - 15 * sc, baseY - 26 * sc);
            ctx.closePath();
            ctx.fill();

            // Academic Tweed Vest & Red Tie
            ctx.fillStyle = "#475569";
            ctx.fillRect(baseX - 4 * sc, baseY - 80 * sc, 8 * sc, 34 * sc);
            ctx.fillStyle = "#dc2626";
            ctx.beginPath();
            ctx.moveTo(baseX - 2 * sc, baseY - 80 * sc);
            ctx.lineTo(baseX + 2 * sc, baseY - 80 * sc);
            ctx.lineTo(baseX + 3 * sc, baseY - 58 * sc);
            ctx.lineTo(baseX, baseY - 53 * sc);
            ctx.lineTo(baseX - 3 * sc, baseY - 58 * sc);
            ctx.closePath();
            ctx.fill();

            // Coat Collar Lapels
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 1.2 * sc;
            ctx.beginPath();
            ctx.moveTo(baseX - 7 * sc, baseY - 82 * sc);
            ctx.lineTo(baseX - 3 * sc, baseY - 62 * sc);
            ctx.moveTo(baseX + 7 * sc, baseY - 82 * sc);
            ctx.lineTo(baseX + 3 * sc, baseY - 62 * sc);
            ctx.stroke();

            // 4. Professor's Head, Beard, Silver Hair & Spectacles
            ctx.save();
            ctx.translate(baseX, baseY - 95 * sc);
            // Look slightly upward toward the chalk when drawing
            if (this.usingChalk || this.usingEraser) {
                const lookDir = this.handTarget.x >= baseX ? 1 : -1;
                this.facing = lookDir;
                ctx.rotate(-0.14 * this.facing);
            }

            // Head
            ctx.fillStyle = "#fed7aa";
            ctx.beginPath();
            ctx.arc(0, 0, 12.5 * sc, 0, Math.PI * 2);
            ctx.fill();

            // Distinguished Silver-Grey Professor Hair & Neat Beard
            ctx.fillStyle = "#e2e8f0";
            ctx.beginPath();
            ctx.arc(-3 * this.facing * sc, -2 * sc, 13 * sc, Math.PI * 0.75, Math.PI * 1.95);
            ctx.fill();

            // Beard / Mustache
            ctx.fillStyle = "#cbd5e1";
            ctx.beginPath();
            ctx.arc(4 * this.facing * sc, 5 * sc, 7 * sc, 0, Math.PI);
            ctx.fill();

            // Gold-Rimmed Professor Glasses
            ctx.strokeStyle = "#fbbf24";
            ctx.lineWidth = 1.5 * sc;
            ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
            ctx.beginPath();
            ctx.arc(6 * this.facing * sc, -1 * sc, 4.2 * sc, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(2 * this.facing * sc, -1 * sc);
            ctx.lineTo(-4 * this.facing * sc, -2 * sc);
            ctx.stroke();
            ctx.restore();

            // 5. Right Arm (2-Bone Inverse Kinematics Reaching Directly to Chalk / Eraser Point!)
            const shoulderX = baseX + 5 * this.facing * sc;
            const shoulderY = baseY - 76 * sc;

            let wristX = shoulderX + 14 * this.facing * sc;
            let wristY = shoulderY + 24 * sc;

            if (this.usingChalk || this.usingEraser) {
                wristX = this.handTarget.x;
                wristY = this.handTarget.y;
            } else if (this.isWalking) {
                wristX = shoulderX + Math.sin(t) * 14 * sc;
                wristY = shoulderY + 26 * sc;
            }

            // Solve 2-segment arm elbow position smoothly
            const L1 = 24 * sc, L2 = 24 * sc;
            const dx = wristX - shoulderX;
            const dy = wristY - shoulderY;
            const dist = Math.min(L1 + L2 - 1, Math.hypot(dx, dy));
            const baseAngle = Math.atan2(dy, dx);
            const cosAngle = Math.max(-1, Math.min(1, (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist)));
            const bend = Math.acos(cosAngle);
            const elbowAngle = baseAngle + bend * (this.facing >= 0 ? 1 : -1);

            const elbowX = shoulderX + Math.cos(elbowAngle) * L1;
            const elbowY = shoulderY + Math.sin(elbowAngle) * L1;

            // Draw Upper Arm & Forearm Sleeve
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 8.5 * sc;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(shoulderX, shoulderY);
            ctx.lineTo(elbowX, elbowY);
            ctx.lineTo(wristX, wristY);
            ctx.stroke();

            // Hand
            ctx.fillStyle = "#fed7aa";
            ctx.beginPath();
            ctx.arc(wristX, wristY, 4.2 * sc, 0, Math.PI * 2);
            ctx.fill();

            // Chalk Stick or Felt Duster in Hand
            if (this.usingChalk) {
                ctx.save();
                ctx.translate(wristX, wristY);
                ctx.rotate(-0.4 * this.facing);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, -2 * sc, 11 * sc * this.facing, 3.5 * sc);
                ctx.restore();
            } else if (this.usingEraser) {
                ctx.save();
                ctx.translate(wristX - 14 * sc, wristY - 8 * sc);
                ctx.fillStyle = "#8d6e63";
                ctx.fillRect(0, 0, 28 * sc, 12 * sc);
                ctx.fillStyle = "#cfd8dc";
                ctx.fillRect(0, 10 * sc, 28 * sc, 4 * sc);
                ctx.restore();
            }

            ctx.restore();
        }
    };

    let lastTime = performance.now();

    function animateChalkboard(now) {
        requestAnimationFrame(animateChalkboard);
        if (!isVisible || document.hidden) {
            lastTime = now;
            return;
        }

        const dt = Math.min((now - lastTime) / 16.667, 2.5);
        lastTime = now;

        // 1. Draw Pre-rendered Realistic Blackboard Background
        if (boardBuffer) {
            ctx.drawImage(boardBuffer, 0, 0, cw, ch);
        }

        const activeSlot = boardSlots[slotInBatch];

        // 2. Professor & Chalkboard State Machine
        if (phase === 'WALKING' && activeSlot) {
            professor.usingChalk = false;
            professor.usingEraser = false;
            // Stand slightly to the side of the molecule so the Professor doesn't block the view
            const standOffset = -28 * scale;
            professor.targetX = activeSlot.x + standOffset;

            if (Math.abs(professor.x - professor.targetX) <= 4) {
                professor.facing = 1;
                phase = 'DRAWING_MOL';
                activeSlot.drawnStrokes = 0;
                activeSlot.currentStrokeProg = 0;
            }

        } else if (phase === 'DRAWING_MOL' && activeSlot) {
            professor.usingChalk = true;
            const comp = activeSlot.compound;
            const st = comp.strokes[activeSlot.drawnStrokes];

            if (st) {
                // Realistic chalk drawing speed
                const speed = st.type === 'line' ? 0.048 : 0.065;
                activeSlot.currentStrokeProg += speed * dt;

                const tip = getActiveChalkTarget(activeSlot, scale);
                professor.handTarget = tip;
                professor.targetX = tip.x - 24 * scale;

                if (Math.random() < 0.35) {
                    spawnChalkDust(tip.x, tip.y, comp.chalkColor);
                }

                if (activeSlot.currentStrokeProg >= 1) {
                    activeSlot.drawnStrokes++;
                    activeSlot.currentStrokeProg = 0;
                }
            } else {
                // Finished all strokes of this molecule -> Now write the compound name & formula below!
                phase = 'WRITING_NAME';
                activeSlot.labelProg = 0;
            }

        } else if (phase === 'WRITING_NAME' && activeSlot) {
            professor.usingChalk = true;
            activeSlot.labelProg = Math.min(1, activeSlot.labelProg + 0.022 * dt);

            const tip = getActiveChalkTarget(activeSlot, scale);
            professor.handTarget = tip;
            professor.targetX = tip.x - 20 * scale;

            if (Math.random() < 0.3) {
                spawnChalkDust(tip.x, tip.y, "#ffffff");
            }

            if (activeSlot.labelProg >= 1) {
                professor.usingChalk = false;
                phase = 'NEXT_PAUSE';
                pauseTimer = 0;
            }

        } else if (phase === 'NEXT_PAUSE') {
            pauseTimer += dt;
            if (pauseTimer > 28) {
                slotInBatch++;
                if (slotInBatch >= PER_BATCH) {
                    phase = 'ADMIRING';
                    pauseTimer = 0;
                    // Walk to the right edge so user can admire all 5 drawn structures clearly
                    professor.targetX = cw - 55 * scale;
                } else {
                    phase = 'WALKING';
                }
            }

        } else if (phase === 'ADMIRING') {
            professor.usingChalk = false;
            professor.usingEraser = false;
            pauseTimer += dt;
            // Keep the completed board visible for ~4.5 seconds before erasing for the next batch of 5
            if (pauseTimer > 270) {
                phase = 'ERASING';
                eraseSweepX = cw;
            }

        } else if (phase === 'ERASING') {
            professor.usingChalk = false;
            professor.usingEraser = true;
            eraseSweepX -= 11 * scale * dt;
            professor.targetX = Math.max(50 * scale, eraseSweepX);
            professor.handTarget = {
                x: eraseSweepX,
                y: ch * 0.46 + Math.sin(eraseSweepX * 0.06) * 45 * scale
            };

            if (Math.random() < 0.65) {
                spawnChalkDust(professor.handTarget.x, professor.handTarget.y, "#ffffff");
            }

            boardSlots.forEach(s => {
                if (s.x > eraseSweepX) s.erased = true;
            });

            if (eraseSweepX <= 40 * scale) {
                professor.usingEraser = false;
                batchIndex = (batchIndex + 1) % 2; // Toggle between Batch 1 (1..5) and Batch 2 (6..10)
                slotInBatch = 0;
                setupBoardSlots();
                phase = 'WALKING';
            }
        }

        // 3. Render All Drawn Chalk Molecules & Handwritten Compound Names Below Them
        boardSlots.forEach((s, idx) => {
            if (s.erased) return;
            const comp = s.compound;

            // Completed strokes
            for (let i = 0; i < s.drawnStrokes; i++) {
                drawChalkStroke(ctx, s.x, s.y, comp.strokes[i], 1, comp.chalkColor, scale);
            }

            // Currently drawing stroke
            if (idx === slotInBatch && phase === 'DRAWING_MOL' && comp.strokes[s.drawnStrokes]) {
                drawChalkStroke(ctx, s.x, s.y, comp.strokes[s.drawnStrokes], s.currentStrokeProg, comp.chalkColor, scale);
            }

            // Progressive Chalk Writing of Compound Name & Formula Underneath
            if (s.labelProg > 0) {
                ctx.save();
                const clipW = 135 * scale * s.labelProg;
                ctx.beginPath();
                ctx.rect(s.x - 67.5 * scale, s.y + 42 * scale, clipW, 45 * scale);
                ctx.clip();

                // Chalk Underline
                ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
                ctx.lineWidth = 1.2 * scale;
                ctx.beginPath();
                ctx.moveTo(s.x - 42 * scale, s.y + 46 * scale);
                ctx.lineTo(s.x + 42 * scale, s.y + 46 * scale);
                ctx.stroke();

                // Compound Name
                ctx.font = `600 ${Math.round(12.5 * scale)}px 'Space Grotesk', sans-serif`;
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText(comp.name, s.x, s.y + 62 * scale);

                // Chemical Formula below Name
                ctx.font = `500 ${Math.round(11 * scale)}px 'Space Grotesk', sans-serif`;
                ctx.fillStyle = comp.chalkColor;
                ctx.fillText(`(${comp.formula})`, s.x, s.y + 77 * scale);

                ctx.restore();
            }
        });

        // 4. Update & Draw the Chemistry Professor
        professor.update(dt);
        professor.draw(ctx);

        // 5. Update & Draw Falling Chalk Dust Particles
        for (let i = chalkDust.length - 1; i >= 0; i--) {
            const p = chalkDust[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.alpha -= 0.018 * dt;
            if (p.alpha <= 0) {
                chalkDust.splice(i, 1);
                continue;
            }
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    resizeBoard();
    requestAnimationFrame(animateChalkboard);
})();

function slowScrollTo(id, dur = 900) {
    document.documentElement.style.scrollBehavior = 'auto';
    const t = document.getElementById(id); if (!t) return;
    const start = window.pageYOffset;
    const dist  = t.getBoundingClientRect().top;
    let t0 = null;
    (function step(now) {
        if (!t0) t0 = now;
        const el = now - t0;
        const p  = Math.min(el / dur, 1);
        const ease = p < 0.5 ? 2*p*p : -1+4*p-2*p*p;
        window.scrollTo(0, start + dist * ease);
        if (el < dur) requestAnimationFrame(step);
        else document.documentElement.style.scrollBehavior = 'smooth';
    })(performance.now());
}

function toggleVoice(e) {
    e.stopPropagation();
    voiceEnabled = !voiceEnabled;
    voiceBtn.textContent = voiceEnabled ? "🔊" : "🔇";
    if (!voiceEnabled && window.speechSynthesis) window.speechSynthesis.cancel();

function speakText(text) {
    if (!voiceEnabled || !window.speechSynthesis) return;
    try {
        window.speechSynthesis.cancel();
        const clean = text.replace(/<[^>]*>/g, '').replace(/[^\w\s.,?!'-]/g, '');
        const utter = new SpeechSynthesisUtterance(clean);
        utter.pitch = 1.25;
        utter.rate = 1.05;
        utter.onstart = () => chutiBot.classList.add('is-talking');
        utter.onend = () => chutiBot.classList.remove('is-talking');
        window.speechSynthesis.speak(utter);
    } catch (_) {}
}

function setBotMood(mood, duration = 2200) {
    chutiBot.classList.remove('mood-happy', 'mood-thinking', 'is-talking');
    if (mood) {
        chutiBot.classList.add(mood);
        if (duration > 0) setTimeout(() => chutiBot.classList.remove(mood), duration);
    }
}

function tryEvaluateMath(lower) {
    let expr = lower
        .replace(/what is|calculate|solve|compute|equals|equal to/g, '')
        .replace(/square root of|sqrt\(/g, 'Math.sqrt(')
        .replace(/\bpi\b/g, 'Math.PI')
        .replace(/\bsin\(/g, 'Math.sin(')
        .replace(/\bcos\(/g, 'Math.cos(')
        .replace(/\btan\(/g, 'Math.tan(')
        .replace(/\blog\(/g, 'Math.log10(')
        .replace(/\^/g, '**')
        .trim();

    if (/^[0-9+\-*/().\s%*MathsqrtPISinCosTanlog10]+$/.test(expr) && /\d/.test(expr) && /[+\-*/^]|Math/.test(expr)) {
        try {
            const result = Function(`"use strict"; return (${expr})`)();
            if (typeof result === 'number' && isFinite(result)) {
                const rounded = Number.isInteger(result) ? result : Number(result.toFixed(6));
                return `🧮 **Quantum Math Engine:**<br>**${esc(lower.replace(/what is|calculate|solve/g,'').trim())} = ${rounded}**`;
            }
        } catch (_) {}
    }
    return null;
}

function extractSearchSubject(raw) {
    return raw
        .replace(/^(who|what|where|when|why|how)\s+(is|are|was|were|does|do|did|can|could|the)\s+/i, '')
        .replace(/^(tell me about|explain|define|meaning of|search for|do you know about|do you know)\s+/i, '')
        .replace(/\b(kiyanna|gana|mokakda|kawda|koheda|monawada)\b/gi, '')
        .replace(/[?!.]+$/g, '')
        .trim();
}

async function fetchWorldKnowledge(userText) {
    const subject = extractSearchSubject(userText);
    if (!subject || subject.length < 2) return null;

    const subLower = subject.toLowerCase().replace(/\belement\b/g, '').trim();
    if (ELEMENTS_DB[subLower]) {
        return `<span class="t-wiki-badge">⚛️ Periodic Table Core</span><br>**${ELEMENTS_DB[subLower]}**`;
    }

    try {
        const searchUrl = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(subject)}&limit=1&namespace=0&format=json&origin=*`;
        const sRes = await fetch(searchUrl);
        if (sRes.ok) {
            const sData = await sRes.json();
            const bestTitle = sData?.[1]?.[0];
            if (bestTitle) {
                const sumUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(bestTitle)}`;
                const sumRes = await fetch(sumUrl);
                if (sumRes.ok) {
                    const sumData = await sumRes.json();
                    if (sumData.extract && sumData.type !== 'disambiguation') {
                        const sentences = sumData.extract.match(/[^.!?]+[.!?]+/g) || [sumData.extract];
                        const shortExtract = sentences.slice(0, 2).join(' ').trim();
                        return `<span class="t-wiki-badge">🌐 Global Knowledge · ${esc(sumData.title)}</span><br>${esc(shortExtract)}`;
                    }
                }
            }
        }
    } catch (_) {}

    try {
        const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(subject)}&format=json&no_html=1&skip_disambig=1`;
        const dRes = await fetch(ddgUrl);
        if (dRes.ok) {
            const dData = await dRes.json();
            const text = dData.AbstractText || dData.Answer || (dData.RelatedTopics?.[0]?.Text);
            if (text) {
                return `<span class="t-wiki-badge">🌐 Omni-Search Core</span><br>${esc(text)}`;
            }
        }
    } catch (_) {}

    return null;
}

async function generateSmartReply(userText) {
    const clean = userText.trim();
    const lower = clean.toLowerCase();

    const mathAns = tryEvaluateMath(lower);
    if (mathAns) return mathAns;

    let bestTopic = null;
    let bestScore = 0;
    for (const topic of BRAIN_TOPICS) {
        let score = 0;
        for (const kw of topic.keywords) {
            if (lower === kw) score += kw.length * 3;
            else if (lower.includes(kw)) score += kw.length;
        }
        if (score > bestScore) {
            bestScore = score;
            bestTopic = topic;
        }
    }

    if (bestTopic && bestScore >= 4) {
        return bestTopic.reply(clean);
    }

    const worldAnswer = await fetchWorldKnowledge(clean);
    if (worldAnswer) return worldAnswer;

    if (bestTopic) return bestTopic.reply(clean);

    return `I searched my quantum banks for **"${esc(clean)}"**! 🤔<br>Try phrasing it as a topic name (e.g., *"Quantum Mechanics"*, *"Albert Einstein"*, *"Sri Lanka"*, *"Benzene"*) or ask me anything about **Malith Eranga, Modern Pixels, or his Chemical Technology degree**!<br><button class='t-action-btn' onclick=\"slowScrollTo('Projects')\">🚀 Explore Showcase</button>`;
}

async function processUserQuestion(questionText) {
    showMsg('user', questionText);
    setBotMood('mood-thinking', 1500);
    const typingRow = showTypingIndicator();
    const startT = performance.now();

    const answer = await generateSmartReply(questionText);
    const elapsed = performance.now() - startT;
    const waitMore = Math.max(0, 480 - elapsed);

    setTimeout(() => {
        typingRow.remove();
        setBotMood('mood-happy', 1800);
        showMsg('bot', answer);
        speakText(answer);
    }, waitMore);
}

function askChip(questionText) {
    processUserQuestion(questionText);
}

function handleTyped() {
    const input = document.getElementById('tora-input');
    const msg   = input.value.trim();
    if (!msg) return;
    input.value = '';
    autoResize(input);
    processUserQuestion(msg);
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleTyped(); }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 70) + 'px';
}

function formatMarkdown(str) {
    return str.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#00ffcc">$1</strong>');
}

function showMsg(role, htmlText) {
    const row = document.createElement('div');
    row.className = `t-msg ${role}`;
    const content = role === 'bot' ? formatMarkdown(htmlText) : esc(htmlText);
    row.innerHTML = `<div class="t-msg-icon ${role}">${role === 'bot' ? '🤖' : '🧑'}</div>
                     <div class="t-bubble">${content}</div>`;
    msgBox.appendChild(row);
    msgBox.scrollTop = msgBox.scrollHeight;
}

function showTypingIndicator() {
    const row = document.createElement('div');
    row.className = 't-msg bot';
    row.innerHTML = `<div class="t-msg-icon bot">🤖</div>
                     <div class="typing-dots"><span></span><span></span><span></span></div>`;
    msgBox.appendChild(row);
    msgBox.scrollTop = msgBox.scrollHeight;
    return row;
}

function esc(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// 5. SMOOTH HARDWARE-ACCELERATED MOUSE TRACKING FOR TORA 2.0
// =========================================================
const chutiHead = document.getElementById('chuti-head');
const chutiEyes = document.getElementById('chuti-eyes');
let cx=0, cy=0, tx=0, ty=0, rx=window.innerWidth/2, ry=window.innerHeight/2;

function updateMouse(x, y) {
    rx = x; ry = y;
    tx = ((x / window.innerWidth)  - 0.5) * 2;
    ty = ((y / window.innerHeight) - 0.5) * 2;
}

document.addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY), { passive: true });

document.querySelectorAll('.Projects-iframe').forEach(f => {
    f.addEventListener('load', () => {
        resizeIframe(f);
        try {
            f.contentWindow.document.addEventListener('mousemove', e => {
                const r = f.getBoundingClientRect();
                updateMouse(e.clientX + r.left, e.clientY + r.top);
            }, { passive: true });
        } catch(_) {}
    });
});

function animateChuti() {
    if (!document.hidden) {
        const r    = chutiBot.getBoundingClientRect();
        const dist = Math.hypot(rx - (r.left + r.width/2), ry - (r.top + r.height/2));
        chutiBot.classList.toggle('tora-active', dist < 160);

        cx += (tx - cx) * 0.1;
        cy += (ty - cy) * 0.1;

        chutiHead.style.transform = `translate3d(${cx*8}px,${cy*5}px,0) rotate(${cx*14}deg)`;
        chutiEyes.style.transform = `translate3d(${cx*9}px,${cy*4}px,0)`;
    }
    requestAnimationFrame(animateChuti);
}
animateChuti();
