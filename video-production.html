<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Production - Modern Pixels</title>
    <link rel="icon" type="image/png" href="Modern Pixels/MODERNPIXELS1.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600&family=Syncopate:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #02040a; 
            --accent: #00bfff; 
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--primary);
            color: var(--text-light);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: ''; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: -4; 
            background-image: url('Backgrounds/background3.webp'); 
            background-size: cover; 
            background-position: center;
            background-color: rgba(2, 4, 10, 0.85); 
            background-blend-mode: overlay;
        }

        /* MAIN CONTENT AREA */
        .container { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 60px 3% 50px 3%; 
            position: relative; 
            z-index: 1; 
        }

        .section-heading { 
            font-family: 'Syncopate', sans-serif; 
            font-size: 2.5rem; 
            text-align: center; 
            color: var(--accent); 
            margin-bottom: 15px; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
        }
        
        .section-sub { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 1.1rem; 
            letter-spacing: 1px; 
            margin-bottom: 60px; 
        }

        /* ------------------------------------- */
        /* MASONRY VIDEO GRID (All in one)       */
        /* ------------------------------------- */
        .video-grid {
            column-count: 3; /* Desktop වල columns 3යි */
            column-gap: 30px;
            margin-bottom: 70px;
        }

        /* GENERAL VIDEO CARD STYLES */
        .video-card {
            position: relative;
            width: 100%;
            background: rgba(10, 15, 25, 0.8);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
            break-inside: avoid; /* Masonry එකේදී කෑලි කැඩෙන එක නවත්වයි */
            margin-bottom: 30px; 
            display: inline-block;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .video-card.landscape {
            aspect-ratio: 16 / 9;
        }

        .video-card.portrait {
            aspect-ratio: 9 / 16;
        }

        .video-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .site-footer { 
            text-align: center; 
            padding: 40px 2%; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            margin-top: 20px; 
            background: rgba(2, 4, 10, 0.9); 
        }
        
        .site-footer p { 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            letter-spacing: 1px; 
        }

        /* Tablet Screens */
        @media (max-width: 992px) {
            .video-grid { 
                column-count: 2; 
            }
        }

        /* Mobile Screens */
        @media (max-width: 768px) {
            .container { padding-top: 40px; }
            .section-heading { font-size: 1.8rem; }
            
            .video-grid { 
                column-count: 1; /* Mobile එකේදී Column 1කට පේන්න හදලා තියෙන්නේ, අවශ්‍ය නම් මෙතන 2 කරන්න */
                column-gap: 20px; 
            }
            .video-card {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
