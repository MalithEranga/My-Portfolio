<!DOCTYPE html>
<html lang="en">

    <title>Video Production - Modern Pixels</title>
    <link rel="icon" type="image/png" href="Modern Pixels/MODERNPIXELS1.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600&family=Syncopate:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #02040a; 
            --accent: #00bfff; 
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--primary);
            color: var(--text-light);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -4; background-image: url('Backgrounds/background3.webp'); 
            background-size: cover; background-position: center;
            background-color: rgba(2, 4, 10, 0.85); background-blend-mode: overlay;
        }

        /* MAIN CONTENT AREA */
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 60px 3% 50px 3%; position: relative; z-index: 1; }

        .section-heading { 
            font-family: 'Syncopate', sans-serif; 
            font-size: 2.5rem; 
            text-align: center; 
            color: var(--accent); 
            margin-bottom: 20px; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
        }
        
        .section-sub { text-align: center; color: var(--text-muted); font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 60px; }

        /* VIDEO GRID (MIXED SIZES) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
            margin-bottom: 80px;
            align-items: start; 
        }

        .video-card {
            position: relative;
            width: 100%;
            background: rgba(10, 15, 25, 0.8);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Standard Landscape Videos (16:9) */
        .video-card.landscape {
            aspect-ratio: 16 / 9;
        }

        /* Vertical Reels (9:16) */
        .video-card.portrait {
            aspect-ratio: 9 / 16;
            max-width: 350px; 
            margin: 0 auto; 
        }

        .video-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
        }

        .site-footer { text-align: center; padding: 40px 2%; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 50px; background: rgba(2, 4, 10, 0.9); }
        .site-footer p { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 1px; }

        @media (max-width: 768px) {
            .container { padding-top: 40px; }
            .section-heading { font-size: 1.8rem; }
            .video-grid { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
