           ඔයාට අලුත් Article එකක් දාන්න ඕනේ නම්, යට තියෙන එකක් ඒ විදිහටම Copy කරලා යටින් Paste කරන්න.

        const articlesDB = [
            
            // ================== CHEMAZ SERIES ARTICLES ==================
            {
                id: 1, // ඔයාට අවශ්‍ය අංකය මෙතනට දෙන්න (උදා: 1)
                category: 'ChemAZ',
                title: 'What is Chemistry? Beyond the Lab Coats and Beakers',
                date: 'October 1, 2026', // අදාල දවසට වෙනස් කරගන්න
                image: 'Article/A1.png', // ඔයාගේ Image එකේ නම (උදා: Article/A1.webp)
                excerpt: 'When most people hear the word "chemistry," they picture dimly lit laboratories and complex equations. But chemistry is not locked away—it is happening all around you every single day.',
                content: `
                    <p>When most people hear the word "chemistry," their minds immediately jump to a very specific set of images. They picture dimly lit laboratories, scientists in pristine white lab coats, safety goggles, bubbling Erlenmeyer flasks filled with neon-colored liquids, and whiteboards covered in complex mathematical equations that look more like an alien language than anything related to daily life. Some might even feel a sudden wave of anxiety, remembering the struggle of memorizing the periodic table of elements back in high school.</p>
                    
                    <p>It is incredibly common to view chemistry as an intimidating, highly academic subject reserved only for those with Ph.Ds. However, this perception could not be further from the truth. Chemistry is not locked away in a laboratory. It is happening right in front of you, all around you, and even inside of you, every single second of every single day.</p>
                    
                    <p>Welcome to the very first installment of the ChemAZ Series. Over the upcoming weeks, we are going to embark on a journey to demystify this fascinating scientific discipline. We will strip away the heavy academic jargon, the confusing formulas, and the intimidation factor, replacing them with clear, relatable, and genuinely interesting explanations of how our universe functions. To begin this journey, we must first answer the most fundamental question of all: What exactly is chemistry?</p>

                    <h3>Demystifying the Definition: What Exactly is Chemistry?</h3>
                    <p>To truly understand what chemistry is, it helps to first look at how the experts define it, and then break that down into something we can easily digest.</p>
                    <p>According to the Encyclopædia Britannica, the formal, academic definition of chemistry is as follows:</p>
                    
                    <p><em>"Chemistry is the science that deals with the properties, composition, and structure of substances (defined as elements and compounds), the transformations they undergo, and the energy that is released or absorbed during these processes."</em></p>
                    
                    <p>If you are not a scientist, reading that definition might make your eyes glaze over. It sounds dense, technical, and disconnected from reality. But if we peel back the layers of academic vocabulary, the core concept is surprisingly simple.</p>
                    <p>In plain, everyday English, <strong>Chemistry is simply the study of "stuff" and how that "stuff" changes.</strong></p>
                    <p>Scientists have a special word for this "stuff"—they call it <strong>Matter</strong>. Matter is the foundational concept of all physical sciences. It is defined as absolutely anything that possesses mass (weight) and takes up physical space (volume). The screen you are reading this on is made of matter. The coffee in your mug is made of matter. The air you are breathing, though invisible, is made of matter. You, yourself, are a highly complex, walking, talking collection of matter.</p>
                    <p>Therefore, because chemistry is the study of matter, it is fundamentally the study of everything in the known physical universe.</p>

                    <h3>The Three Fundamental Questions of Chemistry</h3>
                    <p>Whenever a chemist looks at an object, a substance, or a phenomenon in the world, they are essentially trying to answer three fundamental questions. Understanding these three pillars will help you view the world through the lens of a scientist.</p>
                    
                    <ul>
                        <li><strong>1. Composition: What is this made of?</strong> Everything in the universe is built from microscopic building blocks. If you take a drop of water and zoom in closer and closer, eventually you will stop seeing a continuous liquid and start seeing individual particles. Chemistry seeks to understand these ingredients. What atoms are present? How are they arranged? In the case of water, chemistry tells us that it is composed of two hydrogen atoms attached to one oxygen atom (H₂O). Understanding composition is like having the ultimate recipe book for the universe.</li>
                        <li><strong>2. Properties: How does it behave?</strong> Once we know what something is made of, chemistry asks how it acts in its natural state. These are known as its properties. What color is it? Does it conduct electricity? Is it a solid, a liquid, or a gas at room temperature? At what temperature does it boil or freeze? For example, one of the properties of gold is that it is highly malleable and does not rust, which is why it has been used for jewelry and currency for thousands of years.</li>
                        <li><strong>3. Reactions: What happens when it changes?</strong> This is where chemistry becomes truly dynamic and exciting. The universe is not static; it is constantly transforming. Chemistry studies what happens when you take one type of matter and expose it to another type of matter, or to changes in energy (like extreme heat or cold). If I mix substance A with substance B, will they ignore each other, will they combine to form a brand-new substance C, or will they explode? Understanding reactions allows us to predict the future behavior of matter and harness it to create new technologies, medicines, and materials.</li>
                    </ul>

                    <h3>The Chemistry of Everyday Life (You Are Already a Chemist)</h3>
                    <p>You might not wear a lab coat, but you are performing complex chemical experiments every single day without even realizing it. Once you understand the basic definition of chemistry, you begin to see its fingerprints everywhere.</p>
                    
                    <p><strong>Culinary Chemistry: Science in the Kitchen</strong><br>
                    The kitchen is arguably the most active chemical laboratory in any home. Cooking is entirely based on chemical reactions and phase changes.</p>
                    <ul>
                        <li><strong>Frying an Egg:</strong> When you crack a raw egg into a hot pan, the clear, gooey egg white rapidly turns solid and opaque. This is not magic; it is thermal denaturation. The heat energy from the stove breaks the weak bonds holding the egg's proteins together, causing them to unfold and tangle with each other to form a solid mass.</li>
                        <li><strong>Baking Bread:</strong> The fluffy texture of bread is the result of a chemical reaction. Yeast (a living organism) consumes sugars in the dough and releases carbon dioxide gas. This gas gets trapped in the stretchy gluten network of the dough, creating bubbles that make the bread rise.</li>
                        <li><strong>The Perfect Steak:</strong> That delicious brown crust on a seared steak or the golden-brown color of toasted bread is the result of the Maillard reaction—a complex chemical reaction between amino acids and reducing sugars under heat that creates hundreds of brand-new flavor compounds.</li>
                    </ul>

                    <p><strong>Biological Chemistry: Science Inside You</strong><br>
                    Your body is essentially a highly advanced, self-regulating chemical reactor. Every physiological process keeping you alive right now is driven by chemical reactions.</p>
                    <ul>
                        <li><strong>Breathing:</strong> Respiration is a chemical exchange. You inhale oxygen (O₂), which your red blood cells transport to your tissues. Inside your cells, a chemical reaction uses that oxygen to break down glucose (sugar) to create energy, producing carbon dioxide (CO₂) as a waste product, which you then exhale.</li>
                        <li><strong>Digestion:</strong> When you eat, mechanical chewing is only the first step. Powerful stomach acids (like hydrochloric acid) and specialized chemical proteins called enzymes immediately go to work, breaking down complex carbohydrates, fats, and proteins into their basic molecular building blocks so your body can absorb them.</li>
                    </ul>

                    <p><strong>Emotional Chemistry: The Science of Feelings</strong><br>
                    We often think of our emotions as purely abstract, psychological experiences. In reality, your feelings are deeply rooted in chemistry.</p>
                    <ul>
                        <li><strong>Happiness and Love:</strong> That warm, joyful feeling you get when you see a loved one, achieve a goal, or eat a delicious meal? That is the result of chemical messengers—neurotransmitters like dopamine, serotonin, and oxytocin—flooding your brain's synapses.</li>
                        <li><strong>Stress and Fear:</strong> The sudden spike of energy and racing heartbeat you feel when you are frightened or stressed is triggered by the rapid release of adrenaline and cortisol, chemicals designed to prepare your body for a "fight or flight" response.</li>
                    </ul>

                    <p><strong>Environmental Chemistry: Science in the World Around Us</strong><br>
                    Step outside, and chemistry is shaping the environment.</p>
                    <ul>

        // Show List View & Change Colors Dynamically
        function openCategory(categoryName, themeColor) {
            currentCategory = categoryName;
            currentThemeColor = themeColor;

            // Update entire page CSS variables to match the clicked category
            document.documentElement.style.setProperty('--accent', themeColor);
            
            // Convert Hex to RGBA for glow effect
            let hex = themeColor.replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.6)`);

            hideAllViews();

            const filteredArticles = articlesDB.filter(art => art.category === categoryName);
            listCategoryTitle.innerText = categoryName + " SERIES";
            listContainer.innerHTML = '';

            if (filteredArticles.length === 0) {
                listContainer.innerHTML = `<p style="color:var(--text-muted); text-align:center; grid-column:1/-1;">No articles published in this series yet. Stay tuned!</p>`;
